  scene.add(makeInstanced(fernGeometry, fernMaterial, fernItems, { receiveShadow: true }));
  scene.add(makeInstanced(rockGeometry, rockMaterial, rockItems, { castShadow: true, receiveShadow: true }));

  const mossClumpMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, metalness: 0, flatShading: true });
  if (mossClumpItems.length) {
    scene.add(makeInstanced(new THREE.IcosahedronGeometry(1, 1), mossClumpMaterial, mossClumpItems, { receiveShadow: true }));
  }
  if (mossDecalItems.length) {
    scene.add(makeInstanced(litterGeometry, mossDecalMaterial, mossDecalItems, { receiveShadow: true }));
  }
  scene.add(makeInstanced(litterGeometry, litterMaterial, litterItems, { receiveShadow: false }));
  scene.add(makeInstanced(mushroomStemGeometry, mushroomStemMaterial, mushroomStemItems, {}));
  scene.add(makeInstanced(mushroomCapGeometry, mushroomCapMaterial, mushroomCapItems, { castShadow: false }));
  scene.add(makeInstanced(flowerGeometry, flowerMaterial, flowerItems, {}));
}

/* ==========================================================================
   08 路 ATMOSPHERE 鈥?smoke, dust, mist, light, small night things
   ========================================================================== */

const atmosphere = {
  smoke: null,
  dust: null,
  dustBase: null,
  fireflies: null,
  fireflyBase: null,
  mists: [],
  shafts: [],
  wisps: [],
  smokeBase: [],
};

function createShaftTexture() {
  const W = 128;
  const H = 512;
  const canvas = makeCanvas(W, H);
  const ctx = canvas.getContext('2d');
  const image = ctx.createImageData(W, H);
  const data = image.data;
  for (let y = 0; y < H; y++) {
    const v = y / H;
    for (let x = 0; x < W; x++) {
      const u = x / W;
      const edge = 1 - smoothstep(0.02, 0.5, Math.abs(u - 0.5));
      const lengthFade = smoothstep(0.0, 0.21, v) * (1 - smoothstep(0.55, 1.0, v));
      const noisy = 0.55 + tileFbm(u, v, 4, 3, 93) * 0.7;
      const a = edge * edge * lengthFade * noisy;
      const i = (y * W + x) * 4;
      data[i] = 255;
      data[i + 1] = 238;
      data[i + 2] = 211;
      data[i + 3] = Math.round(a * 235);
    }
  }
  ctx.putImageData(image, 0, 0);
  return toTexture(canvas, {
    wrapS: THREE.ClampToEdgeWrapping,
    wrapT: THREE.ClampToEdgeWrapping,
    aniso: 2,
  });
}

function buildSmoke() {
  const count = 78;
  const positions = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  const alphas = new Float32Array(count);
  const particles = [];
  const origin = cabinAnchors.chimneyWorld
    ? cabinAnchors.chimneyWorld.clone().add(new THREE.Vector3(0, 0.05, 0.55))
    : new THREE.Vector3(2.4, 7.0, -6.0);
  const random = createRng(6501);

  function resetParticle(particle, initial = false) {
    particle.life = range(random, 8.0, 13.0);
    particle.age = initial ? random() * particle.life * 0.88 : 0;
    particle.phase = random() * TAU;
    particle.rise = range(random, 1.35, 3.1);
    particle.sway = range(random, 0.25, 1.0);
    particle.scale = range(random, 0.55, 1.15);
    particle.offsetX = range(random, -0.2, 0.2);
    particle.offsetZ = range(random, -0.2, 0.2);
  }

  for (let i = 0; i < count; i++) {
    const particle = {};
    resetParticle(particle, true);
    particles.push(particle);
    positions[i * 3] = origin.x;
    positions[i * 3 + 1] = origin.y;
    positions[i * 3 + 2] = origin.z;
    sizes[i] = 0.2;
    alphas[i] = 0;
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
  geometry.setAttribute('aAlpha', new THREE.BufferAttribute(alphas, 1));

  const material = new THREE.ShaderMaterial({
    uniforms: {
      uMap: { value: TEX.smoke },
      uColor: { value: new THREE.Color(0x8f8a7f) },
      uOpacity: { value: 1.0 },
      uPixelScale: { value: 1400 },
    },
    vertexShader: /* glsl */ `
      attribute float aSize;
      attribute float aAlpha;
      varying float vAlpha;
      uniform float uPixelScale;
      void main() {
        vAlpha = aAlpha;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * uPixelScale / max(0.5, -mvPosition.z);
        gl_Position = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: /* glsl */ `
      uniform sampler2D uMap;
      uniform vec3 uColor;
      uniform float uOpacity;
      varying float vAlpha;
      void main() {
        vec4 texel = texture2D(uMap, gl_PointCoord);
        if (texel.a < 0.004) discard;
        gl_FragColor = vec4(uColor, texel.a * vAlpha * uOpacity);
      }
    `,
    transparent: true,
    depthWrite: false,
    depthTest: true,
    toneMapped: true,
  });

  const points = new THREE.Points(geometry, material);
  points.frustumCulled = false;
  points.renderOrder = 4;
  scene.add(points);
  atmosphere.smoke = { points, particles, positions, sizes, alphas, geometry, material, origin, random, resetParticle };
}

function updateSmoke(dt) {
  const smoke = atmosphere.smoke;
  if (!smoke) return;
  const { particles, positions, sizes, alphas, geometry, origin, resetParticle } = smoke;
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    p.age += dt;
    if (p.age >= p.life) resetParticle(p, false);
    const t = clamp01(p.age / p.life);
    const curl = Math.sin(t * 5.3 + p.phase) * (0.1 + t * 0.75) * p.sway;
    const curlZ = Math.cos(t * 4.1 + p.phase * 1.3) * (0.08 + t * 0.55) * p.sway;
    positions[i * 3] = origin.x + p.offsetX + curl + t * 1.1;
    positions[i * 3 + 1] = origin.y + t * p.rise;
    positions[i * 3 + 2] = origin.z + p.offsetZ + curlZ + t * 0.22;
    sizes[i] = (0.52 + t * 1.25) * p.scale;
    const fadeIn = smoothstep(0.0, 0.035, t);
    const fadeOut = 1 - smoothstep(0.32, 1.0, t);
    alphas[i] = Math.min(fadeIn, fadeOut) * (0.8 + 0.14 * Math.sin(t * 9.0 + p.phase));
  }
  geometry.attributes.position.needsUpdate = true;
  geometry.attributes.aSize.needsUpdate = true;
  geometry.attributes.aAlpha.needsUpdate = true;
}

function buildDust() {
  const count = 92;
  const positions = new Float32Array(count * 3);
  const base = [];
  const random = createRng(7302);
  for (let i = 0; i < count; i++) {
    const x = range(random, -9, 15);
    const y = range(random, 0.2, 8.5);
    const z = range(random, -12, 5);
    positions[i * 3] = x;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = z;
    base.push({ x, y, z, phase: random() * TAU, speed: range(random, 0.12, 0.38) });
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const material = new THREE.PointsMaterial({
    map: TEX.glow,
    color: 0xffdfae,
    size: 0.075,
    transparent: true,
    opacity: 0.3,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true,
    fog: true,
  });
  const points = new THREE.Points(geometry, material);
  points.frustumCulled = false;
  points.renderOrder = 5;
  scene.add(points);
  atmosphere.dust = { points, positions, base, geometry, material };
}

function updateDust(time) {
  const dust = atmosphere.dust;
  if (!dust) return;
  const { positions, base, geometry } = dust;
  for (let i = 0; i < base.length; i++) {
    const b = base[i];
    positions[i * 3] = b.x + Math.sin(time * b.speed + b.phase) * 0.45;
    positions[i * 3 + 1] = b.y + Math.sin(time * b.speed * 0.7 + b.phase * 1.4) * 0.25;
    positions[i * 3 + 2] = b.z + Math.cos(time * b.speed * 0.8 + b.phase) * 0.35;
  }
  geometry.attributes.position.needsUpdate = true;
  dust.material.opacity = 0.38 + Math.sin(time * 0.31) * 0.055;
}

function buildFireflies() {
  const count = 14;
  const positions = new Float32Array(count * 3);
  const base = [];
  const random = createRng(560);
  const spots = [
    [-3.2, 0.8, 4.5], [-4.1, 0.7, 2.0], [2.4, 0.75, 3.0], [7.1, 0.6, -0.8],
    [0.8, 0.5, -1.9], [-1.5, 0.6, 6.2], [5.8, 0.75, 2.2], [9.5, 0.6, -2.0],
  ];
  for (let i = 0; i < count; i++) {
    const spot = spots[i % spots.length];
    const x = spot[0] + range(random, -0.7, 0.7);
    const y = spot[1] + range(random, 0.1, 1.15);
    const z = spot[2] + range(random, -0.7, 0.7);
    positions[i * 3] = x;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = z;
    base.push({ x, y, z, phase: random() * TAU, speed: range(random, 0.32, 0.8) });
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const material = new THREE.PointsMaterial({
    map: TEX.glow,
    color: 0xffc36b,
    size: 0.12,
    transparent: true,
    opacity: 0.42,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true,
    fog: true,
  });
  const points = new THREE.Points(geometry, material);
  points.frustumCulled = false;
  points.renderOrder = 6;
  scene.add(points);
  atmosphere.fireflies = { points, positions, base, geometry, material };
  atmosphere.fireflyBase = base;
}

function updateFireflies(time) {
  const flies = atmosphere.fireflies;
  if (!flies) return;
  const { positions, base, geometry } = flies;
  for (let i = 0; i < base.length; i++) {
    const b = base[i];
    positions[i * 3] = b.x + Math.sin(time * b.speed + b.phase) * 0.55;
    positions[i * 3 + 1] = b.y + Math.sin(time * b.speed * 0.55 + b.phase * 2.0) * 0.3;
    positions[i * 3 + 2] = b.z + Math.cos(time * b.speed * 0.75 + b.phase) * 0.45;
  }
  geometry.attributes.position.needsUpdate = true;
  flies.material.opacity = 0.28 + Math.sin(time * 1.3) * 0.075 + Math.sin(time * 2.1 + 0.7) * 0.05;
}

function buildMist() {
  const random = createRng(970);
  const palettes = ['#c9cbb9', '#d7d4c0', '#c3c7b5', '#dcd7c2', '#bac2b3'];
  const configs = [
    [-13, 2.8, -20, 34, 9, 0.16],
    [-2.5, 3.4, -15, 24, 7, 0.12],
    [10, 2.6, -23, 31, 8.5, 0.14],
    [22, 3.8, -30, 34, 9, 0.11],
    [-25, 3.0, -31, 30, 8, 0.1],
    [4, 2.2, -38, 44, 11, 0.14],
    [-7.5, 0.8, 1.8, 10, 2.8, 0.085],
    [8.2, 0.7, -8.5, 16, 3.8, 0.09],
    [15, 4.8, -17, 20, 6, 0.08],
    [0.5, 1.0, -9.5, 20, 4.6, 0.065],
    [-12.5, 1.2, -6.0, 16, 3.6, 0.055],
  ];
  for (let i = 0; i < configs.length; i++) {
    const [x, y, z, w, h, opacity] = configs[i];
    const material = new THREE.SpriteMaterial({
      map: TEX.mist,
      color: palettes[i % palettes.length],
      transparent: true,
      opacity,
      depthWrite: false,
      depthTest: true,
      blending: THREE.NormalBlending,
      fog: true,
    });
    const sprite = new THREE.Sprite(material);
    sprite.position.set(x, y, z);
    sprite.scale.set(w, h, 1);
    sprite.renderOrder = 2;
    scene.add(sprite);
    atmosphere.mists.push({
      sprite,
      baseX: x,
      baseY: y,
      baseOpacity: opacity,
      phase: random() * TAU,
      speed: range(random, 0.018, 0.05),
      drift: range(random, 1.2, 3.8),
    });
  }
}

function updateMist(time) {
  for (const mist of atmosphere.mists) {
    mist.sprite.position.x = mist.baseX + Math.sin(time * mist.speed + mist.phase) * mist.drift;
    mist.sprite.position.y = mist.baseY + Math.sin(time * mist.speed * 0.72 + mist.phase * 1.7) * 0.22;
    mist.sprite.material.opacity = mist.baseOpacity * (0.82 + Math.sin(time * mist.speed * 1.7 + mist.phase) * 0.18);
  }
}

function buildLightShafts() {
  // Camera-facing soft beams rather than world-space planes: no hard
  // rectangular edges when the camera drifts, and trees still occlude them.
  const shaftTexture = createShaftTexture();
  const configs = [
    { x: -10.5, y: 9.2, z: -17.0, w: 4.2, h: 20, rotation: 0.35, opacity: 0.16 },
    { x: -2.0, y: 8.6, z: -22.0, w: 3.4, h: 18, rotation: 0.48, opacity: 0.12 },
    { x: 6.5, y: 9.8, z: -25.0, w: 3.8, h: 21, rotation: 0.58, opacity: 0.09 },
    { x: -6.4, y: 6.4, z: -8.5, w: 2.2, h: 12, rotation: 0.38, opacity: 0.1 },
    { x: 0.8, y: 7.3, z: -12.0, w: 2.4, h: 14, rotation: 0.5, opacity: 0.07 },
  ];
  for (let i = 0; i < configs.length; i++) {
    const config = configs[i];
    const material = new THREE.SpriteMaterial({
      map: shaftTexture,
      color: 0xffdfb0,
      transparent: true,
      opacity: config.opacity,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: true,
      fog: false,
    });
    material.rotation = config.rotation;
    const sprite = new THREE.Sprite(material);
    sprite.position.set(config.x, config.y, config.z);
    sprite.scale.set(config.w, config.h, 1);
    sprite.renderOrder = 1;
    scene.add(sprite);
    atmosphere.shafts.push({ sprite, baseOpacity: config.opacity, phase: i * 1.9 });
  }
}

function buildChimneyWisps() {
  const origin = cabinAnchors.chimneyWorld
    ? cabinAnchors.chimneyWorld.clone().add(new THREE.Vector3(0, 0.05, 0.55))
    : new THREE.Vector3(2.3, 7.4, -5.8);
  const random = createRng(8124);
  for (let i = 0; i < 10; i++) {
    const material = new THREE.SpriteMaterial({
      map: TEX.smoke,
      color: 0xb0a99b,
      transparent: true,
      opacity: 0,
      depthWrite: false,
      depthTest: false,
      blending: THREE.NormalBlending,
      fog: false,
    });
    const sprite = new THREE.Sprite(material);
    sprite.renderOrder = 6;
    scene.add(sprite);
    atmosphere.wisps.push({
      sprite,
      age: random() * 6,
      life: range(random, 6.5, 9.5),
      phase: random() * TAU,
      drift: range(random, 0.55, 1.25),
      rise: range(random, 0.75, 1.5),
      scale: range(random, 1.0, 1.65),
      origin,
    });
  }

  // Two fixed, very soft puffs keep the base of the plume legible from the
  // default camera, where most of the rising particles are above the frame.
  const basePuffs = [
    { offset: new THREE.Vector3(0.18, 0.75, 0.32), scale: [1.9, 3.0], opacity: 0.18, phase: 0.4 },
    { offset: new THREE.Vector3(0.65, 1.65, 0.28), scale: [2.1, 2.5], opacity: 0.11, phase: 2.1 },
  ];
  for (const puff of basePuffs) {
    const material = new THREE.SpriteMaterial({
      map: TEX.smoke,
      color: 0xc8c0b1,
      transparent: true,
      opacity: puff.opacity,
      depthWrite: false,
      depthTest: false,
      blending: THREE.NormalBlending,
      fog: false,
    });
    material.rotation = -0.08;
    const sprite = new THREE.Sprite(material);
    sprite.position.copy(origin).add(puff.offset);
    sprite.scale.set(puff.scale[0], puff.scale[1], 1);
    sprite.renderOrder = 6;
    scene.add(sprite);
    atmosphere.smokeBase.push({ sprite, fade: puff.opacity, phase: puff.phase });
  }
}

function updateChimneyWisps(dt) {
  for (const puff of atmosphere.smokeBase) {
    puff.sprite.material.opacity = puff.fade * (0.8 + Math.sin(windTime.value * 0.5 + puff.phase) * 0.2);
    puff.sprite.position.x += Math.sin(windTime.value * 0.18 + puff.phase) * 0.0008;
  }
  for (const wisp of atmosphere.wisps) {
    wisp.age += dt;
    if (wisp.age >= wisp.life) wisp.age = 0;
    const t = clamp01(wisp.age / wisp.life);
    const drift = Math.pow(t, 1.25) * wisp.drift + Math.sin(t * 2.8 + wisp.phase) * 0.1;
    wisp.sprite.position.set(
      wisp.origin.x + drift,
      wisp.origin.y + t * wisp.rise,
      wisp.origin.z + t * 0.34 + Math.cos(t * 2.1 + wisp.phase) * 0.06
    );
    const scale = (0.95 + t * 1.2) * wisp.scale;
    wisp.sprite.scale.set(scale, scale * 0.9, 1);
    const fadeIn = smoothstep(0.0, 0.12, t);
    const fadeOut = 1 - smoothstep(0.45, 1.0, t);
    wisp.sprite.material.opacity = Math.min(fadeIn, fadeOut) * 0.55;
  }
}

function buildAtmosphere() {
  buildSmoke();
  buildChimneyWisps();
  buildDust();
  buildFireflies();
  buildMist();
  buildLightShafts();
}

/* ==========================================================================
   09 路 POST PROCESSING
   ========================================================================== */

let composer;
let bloomPass;
let gradePass;

const GradeShader = {
  uniforms: {
    tDiffuse: { value: null },
    uResolution: { value: new THREE.Vector2(1, 1) },
    uTime: { value: 0 },
    uVignette: { value: 0.19 },
    uGrain: { value: 0.022 },
    uGlowCenter: { value: new THREE.Vector2(0.02, 0.88) },
    uGlowStrength: { value: TOUCH ? 0.05 : 0.09 },
  },
  vertexShader: /* glsl */ `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */ `
    uniform sampler2D tDiffuse;
    uniform vec2 uResolution;
    uniform float uTime;
    uniform float uVignette;
    uniform float uGrain;
    uniform vec2 uGlowCenter;
    uniform float uGlowStrength;
    varying vec2 vUv;

    float hash12(vec2 p) {
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }

    void main() {
      vec3 color = texture2D(tDiffuse, vUv).rgb;

      // Gentle teal shadow / amber highlight split, very restrained.
      float luma = dot(color, vec3(0.2126, 0.7152, 0.0722));
      color = mix(vec3(luma), color, 1.045);
      vec3 shadowTint = vec3(0.925, 0.994, 1.055);
      vec3 highlightTint = vec3(1.06, 1.004, 0.92);
      color *= mix(shadowTint, highlightTint, smoothstep(0.1, 0.8, luma));

      // Creamy contrast curve with a whisper of lifted blacks.
      color = (color - 0.5) * 1.055 + 0.5 + vec3(0.011, 0.012, 0.011);

      // A soft warm breath of evening light entering from the upper left.
      vec2 glowDelta = vUv - uGlowCenter;
      glowDelta.x *= uResolution.x / max(1.0, uResolution.y) * 0.72;
      float canopyGlow = smoothstep(1.15, 0.0, length(glowDelta));
      color += vec3(0.055, 0.040, 0.016) * canopyGlow * uGlowStrength * 12.0;

      // A whisper of vignetting; the CSS overlay does the rest.
      vec2 uv = vUv - 0.5;
      uv.x *= uResolution.x / max(1.0, uResolution.y);
      float vig = smoothstep(0.94, 0.28, length(uv) * 1.14);
      color *= mix(1.0 - uVignette, 1.0, vig);

      // Very fine animated grain.
      float grain = hash12(vUv * uResolution + fract(uTime) * 91.7) - 0.5;
      color += grain * uGrain;

      gl_FragColor = vec4(clamp(color, 0.0, 1.0), 1.0);
    }
  `,
};

function buildPostProcessing() {
  composer = new EffectComposer(renderer);
  composer.renderTarget1.samples = CONFIG.render.msaaSamples;
  composer.renderTarget2.samples = CONFIG.render.msaaSamples;
  composer.setPixelRatio(currentPixelRatio);
  composer.setSize(window.innerWidth, window.innerHeight);

  const renderPass = new RenderPass(scene, camera);
  composer.addPass(renderPass);

  bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    CONFIG.render.bloomStrength,
    CONFIG.render.bloomRadius,
    CONFIG.render.bloomThreshold
  );
  composer.addPass(bloomPass);

  const outputPass = new OutputPass();
  composer.addPass(outputPass);

  gradePass = new ShaderPass(GradeShader);
  gradePass.material.toneMapped = false;
  composer.addPass(gradePass);

  updateGradeResolution();
}

function updateGradeResolution() {
  if (!gradePass) return;
  const size = renderer.getDrawingBufferSize(new THREE.Vector2());
  gradePass.uniforms.uResolution.value.copy(size);
}

function updatePointScale() {
  if (!atmosphere.smoke) return;
  const size = renderer.getDrawingBufferSize(new THREE.Vector2());
  const scale = size.y / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) * 0.5));
  atmosphere.smoke.material.uniforms.uPixelScale.value = scale;
}

const ui = {
  loading: document.getElementById('loading'),
  loadingNote: document.getElementById('loadingNote'),
  lanternButton: document.getElementById('lanternButton'),
  lanternState: document.getElementById('lanternState'),
  caption: document.getElementById('caption'),
  hint: document.getElementById('hint'),
};

let cabinClickProxy = null;
let captionTimer = 0;
let lanternOn = true;
let lanternLevel = 1;
const lanternBaseIntensity = 2.8;

function showCaption(text, duration = 6800) {
  if (!ui.caption) return;
  window.clearTimeout(captionTimer);
  ui.caption.textContent = text;
  ui.caption.classList.add('visible');
  captionTimer = window.setTimeout(() => ui.caption.classList.remove('visible'), duration);
}

function setLantern(on) {
  lanternOn = on;
  if (ui.lanternButton) {
    ui.lanternButton.setAttribute('aria-pressed', String(on));
  }
  if (ui.lanternState) ui.lanternState.textContent = on ? 'on' : 'off';
  document.body.classList.add('exploring');
}

function toggleLantern() {
  setLantern(!lanternOn);
}

function updateLantern(dt, time) {
  lanternLevel += ((lanternOn ? 1 : 0) - lanternLevel) * Math.min(1, dt * 5.2);
  const flicker = 1 + Math.sin(time * 8.7 + 0.8) * 0.025 + Math.sin(time * 17.3 + 2.3) * 0.013;
  if (cabinAnchors.lanternPoint) {
    cabinAnchors.lanternPoint.intensity = lanternBaseIntensity * lanternLevel * flicker;
  }
  if (cabinAnchors.lanternGlassMaterial) {
    cabinAnchors.lanternGlassMaterial.emissiveIntensity = 1.55 * lanternLevel * (0.96 + Math.sin(time * 5.2) * 0.04);
  }
  if (cabinAnchors.lanternInner) {
    cabinAnchors.lanternInner.visible = lanternLevel > 0.03;
  }
  if (cabinAnchors.lanternGlow) {
    cabinAnchors.lanternGlow.material.opacity = 0.42 * lanternLevel;
    const pulse = 1 + Math.sin(time * 2.7) * 0.045;
    cabinAnchors.lanternGlow.scale.set(0.95 * pulse, 0.95 * pulse, 1);
  }
  if (ui.lanternButton) {
    ui.lanternButton.style.setProperty('--lamp-level', lanternLevel.toFixed(3));
  }
  // The windows breathe almost imperceptibly, like a room with candles.
  for (const light of windowLights) {
    if (!light.userData.baseIntensity) light.userData.baseIntensity = light.intensity;
    light.intensity = light.userData.baseIntensity * (0.97 + Math.sin(time * 1.7 + light.position.x) * 0.025);
  }
}

function buildInteraction() {
  const proxyMat = new THREE.MeshBasicMaterial({
    transparent: true,
    opacity: 0,
    depthWrite: false,
    colorWrite: false,
  });
  cabinClickProxy = new THREE.Mesh(new THREE.BoxGeometry(9.2, 6.3, 8.0), proxyMat);
  cabinClickProxy.position.set(CABIN.center.x, 3.1, CABIN.center.z + 0.6);
  cabinClickProxy.userData.action = 'cabin';
  scene.add(cabinClickProxy);

  const lanternHitMeshes = [];
  if (cabinAnchors.lanternGroup) {
    cabinAnchors.lanternGroup.traverse((child) => {
      if (child.isMesh) lanternHitMeshes.push(child);
    });
  }

  let downX = 0;
  let downY = 0;
  let downTime = 0;
  let tracking = false;
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();

  canvas.addEventListener('pointerdown', (event) => {
    if (event.button !== undefined && event.button !== 0) return;
    userHasInteracted = true;
    controls.autoRotate = false;
    document.body.classList.add('exploring');
    tracking = true;
    downX = event.clientX;
    downY = event.clientY;
    downTime = performance.now();
  });

  function handleTap(event) {
    if (!tracking) return;
    tracking = false;
    const dx = event.clientX - downX;
    const dy = event.clientY - downY;
    const elapsed = performance.now() - downTime;
    if (Math.hypot(dx, dy) > 7 || elapsed > 700) return;
    pointer.set(
      (event.clientX / window.innerWidth) * 2 - 1,
      -(event.clientY / window.innerHeight) * 2 + 1
    );
    raycaster.setFromCamera(pointer, camera);

    if (lanternHitMeshes.length) {
      const lanternHit = raycaster.intersectObjects(lanternHitMeshes, false);
      if (lanternHit.length > 0) {
        toggleLantern();
        showCaption(lanternOn ? 'The lantern is lit. The porch keeps its little sun.' : 'The lantern dims. The forest takes the porch back.', 4200);
        return;
      }
    }

    if (cabinClickProxy) {
      const cabinHit = raycaster.intersectObject(cabinClickProxy, false);
      if (cabinHit.length > 0) {
        showCaption('Woodsmoke, wet moss, and a kettle just off the boil. Someone will be home soon.');
      }
    }
  }

  canvas.addEventListener('pointerup', handleTap);
  canvas.addEventListener('pointercancel', () => { tracking = false; });
  canvas.addEventListener('pointerleave', () => { tracking = false; });

  controls.addEventListener('start', () => {
    userHasInteracted = true;
    controls.autoRotate = false;
    document.body.classList.add('exploring');
  });

  ui.lanternButton.addEventListener('click', () => {
    userHasInteracted = true;
    controls.autoRotate = false;
    toggleLantern();
    showCaption(lanternOn ? 'The lantern is lit. The porch keeps its little sun.' : 'The lantern dims. The forest takes the porch back.', 4200);
  });

  window.addEventListener('keydown', (event) => {
    if (event.defaultPrevented) return;
    if (event.key === 'l' || event.key === 'L') {
      userHasInteracted = true;
      controls.autoRotate = false;
      toggleLantern();
    }
  });

  // A small accessible escape hatch for the WebGL canvas.
  canvas.addEventListener('webglcontextlost', (event) => {
    event.preventDefault();
    if (ui.loadingNote) {
      ui.loadingNote.textContent = 'The clearing lost its light 鈥?WebGL context was lost.';
      ui.loadingNote.classList.add('error');
    }
    if (ui.loading) ui.loading.classList.remove('done');
  });
}

/* ==========================================================================
   11 路 BUILD + ANIMATION
   ========================================================================== */

const clock = new THREE.Clock();
const elapsed = { value: 0 };
let currentPixelRatio = DPR;
let didReveal = false;
let firstFrame = true;
let perfWindow = 0;
let perfFrames = 0;

function autoRotateBounds() {
  if (!controls.autoRotate) return;
  const az = controls.getAzimuthalAngle();
  const speed = layoutProfile.autoRotateSpeed;
  if (az >= layoutProfile.maxAzimuth - 0.004) {
    controls.autoRotateSpeed = -speed;
  } else if (az <= layoutProfile.minAzimuth + 0.004) {
    controls.autoRotateSpeed = speed;
  }
}

function updateAtmosphere(time) {
  updateMist(time);
  for (const shaft of atmosphere.shafts) {
    shaft.sprite.material.opacity = shaft.baseOpacity * (0.82 + Math.sin(time * 0.21 + shaft.phase) * 0.18);
  }
}

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed.value += dt;
  const time = elapsed.value;
  windTime.value = time;

  autoRotateBounds();
  controls.update();
  updateSmoke(dt);
  updateChimneyWisps(dt);
  updateDust(time);
  updateFireflies(time);
  updateAtmosphere(time);
  updateLantern(dt, time);
  if (gradePass) gradePass.uniforms.uTime.value = time;

  if (firstFrame) {
    renderer.shadowMap.needsUpdate = true;
    firstFrame = false;
  }

  renderer.info.reset();
  composer.render(dt);

  if (!didReveal) {
    didReveal = true;
    window.setTimeout(() => {
      if (ui.loading) ui.loading.classList.add('done');
      document.body.classList.add('ready');
      window.__READY__ = true;
      window.__READY_AT_MS__ = performance.now();
    }, QA ? 120 : 380);
  }

  // Low-stakes adaptive resolution; mobile GPUs get a gentler floor.
  if (CONFIG.quality.adaptive && time > 4) {
    perfFrames++;
    perfWindow += dt;
    if (perfWindow > 2.4) {
      const fps = perfFrames / perfWindow;
      if (fps < CONFIG.quality.targetFps && currentPixelRatio > CONFIG.quality.minPixelRatio) {
        currentPixelRatio = Math.max(CONFIG.quality.minPixelRatio, currentPixelRatio - 0.25);
        applyPixelRatio(currentPixelRatio);
      }
      perfFrames = 0;
      perfWindow = 0;
    }
  }
}

function applyPixelRatio(ratio) {
  currentPixelRatio = ratio;
  renderer.setPixelRatio(ratio);
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  composer.setPixelRatio(ratio);
  composer.setSize(window.innerWidth, window.innerHeight);
  updateGradeResolution();
  updatePointScale();
}

function onResize() {
  const width = window.innerWidth;
  const height = window.innerHeight;
  const previousKey = layoutKey;
  layoutProfile = getLayoutProfile();
  layoutKey = layoutProfile.key;

  camera.aspect = width / Math.max(1, height);
  camera.fov = layoutProfile.fov;
  camera.updateProjectionMatrix();

  controls.minDistance = layoutProfile.minDistance;
  controls.maxDistance = layoutProfile.maxDistance;
  controls.minAzimuthAngle = layoutProfile.minAzimuth;
  controls.maxAzimuthAngle = layoutProfile.maxAzimuth;

  if (!userHasInteracted && previousKey !== layoutKey) {
    controls.autoRotateSpeed = layoutProfile.autoRotateSpeed;
    positionCamera(layoutProfile);
  }

  renderer.setPixelRatio(currentPixelRatio);
  renderer.setSize(width, height, false);
  if (composer) {
    composer.setPixelRatio(currentPixelRatio);
    composer.setSize(width, height);
  }
  updateGradeResolution();
  updatePointScale();
}

function init() {
  const buildStart = performance.now();
  buildSky();
  buildLights();
  buildTerrain();
  buildPath();
  buildCabin();
  buildForest();
  buildUndergrowth();
  buildAtmosphere();
  buildPostProcessing();
  buildInteraction();
  updatePointScale();
  window.__BUILD_MS__ = Math.round(performance.now() - buildStart);

  window.addEventListener('resize', onResize, { passive: true });
  window.addEventListener('orientationchange', () => window.setTimeout(onResize, 120));
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) clock.getDelta();
  });
  document.body.classList.add('ready');

  if (TOUCH) {
    const hintParts = document.querySelectorAll('#hint span');
    if (hintParts.length >= 2) {
      hintParts[1].textContent = 'Pinch to zoom';
    }
  }

  window.__CABIN__ = {
    THREE,
    scene,
    camera,
    renderer,
    controls,
    atmosphere,
    cabinAnchors,
    get composer() { return composer; },
    get bloomPass() { return bloomPass; },
    get gradePass() { return gradePass; },
    get info() {
      return {
        calls: renderer.info.render.calls,
        triangles: renderer.info.render.triangles,
        geometries: renderer.info.memory.geometries,
        textures: renderer.info.memory.textures,
        pixelRatio: currentPixelRatio,
        lanternOn,
        ready: !!window.__READY__,
      };
    },
    get lanternOn() { return lanternOn; },
    setLantern,
    setQuality: applyPixelRatio,
  };

  // Warm up shadow casting once, then leave the light's shadow map static:
  // the sun and world are static and this is a meaningful mid-device win.
  renderer.shadowMap.autoUpdate = false;
  renderer.shadowMap.needsUpdate = true;
  renderer.setAnimationLoop(animate);
}

init();


  </script>
