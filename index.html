  <style>
:root {
  --paper: #ede7d9;
  --paper-dim: rgba(237, 231, 217, 0.62);
  --paper-faint: rgba(237, 231, 217, 0.38);
  --amber: #e8b06c;
  --deep: #0b100c;
  --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  --sans: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--deep);
}

body {
  color: var(--paper);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

#app { position: fixed; inset: 0; }

#scene {
  position: fixed;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  outline: none;
  touch-action: none;
  cursor: grab;
}

#scene:active { cursor: grabbing; }

/* Barely-there print texture over the image; never in the way. */
.atmosphere {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(8, 12, 9, 0.16) 0%, rgba(8, 12, 9, 0) 22%, rgba(8, 12, 9, 0) 72%, rgba(8, 12, 9, 0.24) 100%);
  mix-blend-mode: multiply;
  opacity: 0.85;
}

.title-block {
  position: fixed;
  top: clamp(24px, 4.6vw, 58px);
  left: clamp(22px, 4.2vw, 62px);
  z-index: 3;
  pointer-events: none;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 1.4s ease 0.25s, transform 1.4s cubic-bezier(.2,.7,.2,1) 0.25s;
  text-shadow: 0 2px 24px rgba(4, 8, 5, 0.52);
}

body.ready .title-block { opacity: 1; transform: translateY(0); }

.eyebrow {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 12px;
  font-size: 0.62rem;
  font-weight: 500;
  line-height: 1;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--paper-dim);
}

.eyebrow .rule {
  display: inline-block;
  width: 30px;
  height: 1px;
  background: linear-gradient(90deg, var(--amber), rgba(232, 176, 108, 0));
}

h1 {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(2.2rem, 4.7vw, 3.9rem);
  font-weight: 400;
  line-height: 0.92;
  letter-spacing: -0.035em;
}

.subtitle {
  margin: 11px 0 0 1px;
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(0.76rem, 1.1vw, 0.9rem);
  letter-spacing: 0.035em;
  color: var(--paper-dim);
}

.hint {
  position: fixed;
  left: 50%;
  bottom: max(22px, calc(env(safe-area-inset-bottom) + 18px));
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 22px;
  transform: translate(-50%, 8px);
  font-size: 0.61rem;
  font-weight: 500;
  line-height: 1;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  white-space: nowrap;
  color: var(--paper-faint);
  text-shadow: 0 1px 14px rgba(4, 8, 5, 0.8);
  opacity: 0;
  transition: opacity 1.2s ease 1.5s, transform 1.2s ease 1.5s;
  pointer-events: none;
}

.hint span + span::before {
  content: "";
  display: inline-block;
  width: 2px;
  height: 2px;
  margin-right: 22px;
  border-radius: 50%;
  background: rgba(237, 231, 217, 0.28);
  vertical-align: middle;
}

body.ready .hint { opacity: 1; transform: translate(-50%, 0); }
body.exploring .hint { opacity: 0; transition-delay: 0s; }

.lantern-ui {
  position: fixed;
  right: clamp(20px, 3.9vw, 56px);
  bottom: max(18px, calc(env(safe-area-inset-bottom) + 14px));
  z-index: 4;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  min-height: 36px;
  padding: 0 14px;
  border: 1px solid rgba(237, 231, 217, 0.15);
  border-radius: 999px;
  background: rgba(13, 18, 14, 0.22);
  color: var(--paper-dim);
  font: 500 0.6rem/1 var(--sans);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  backdrop-filter: blur(7px) saturate(0.9);
  -webkit-backdrop-filter: blur(7px) saturate(0.9);
  cursor: pointer;
  opacity: 0;
  transition: opacity 1.2s ease 1.7s, background .35s ease, border-color .35s ease, color .35s ease;
}

body.ready .lantern-ui { opacity: 1; }

.lantern-ui:hover {
  color: var(--paper);
  border-color: rgba(232, 176, 108, 0.4);
  background: rgba(27, 28, 19, 0.42);
}

.lantern-ui:focus-visible {
  outline: 1px solid var(--amber);
  outline-offset: 3px;
}

.lamp-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--amber);
  box-shadow: 0 0 8px 2px rgba(232, 176, 108, 0.55);
  transition: background .4s ease, box-shadow .4s ease;
}

.lamp-state { color: rgba(237, 231, 217, 0.4); letter-spacing: 0.08em; text-transform: lowercase; }

.lantern-ui[aria-pressed="false"] .lamp-dot {
  background: #5c5e53;
  box-shadow: none;
}

.lantern-ui[aria-pressed="false"] .lamp-state { color: rgba(237, 231, 217, 0.3); }

.caption {
  position: fixed;
  left: clamp(22px, 4.2vw, 62px);
  bottom: clamp(68px, 9vh, 96px);
  z-index: 3;
  max-width: min(320px, 64vw);
  padding: 0;
  border-left: 1px solid rgba(232, 176, 108, 0.5);
  padding-left: 14px;
  font-family: var(--serif);
  font-style: italic;
  font-size: 0.86rem;
  line-height: 1.55;
  letter-spacing: 0.015em;
  color: rgba(237, 231, 217, 0.74);
  text-shadow: 0 1px 18px rgba(4, 8, 5, 0.85);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity .8s ease, transform .8s ease;
  pointer-events: none;
}

.caption.visible { opacity: 1; transform: translateY(0); }

.loading {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  background:
    radial-gradient(ellipse at 52% 44%, rgba(47, 52, 36, 0.55) 0%, rgba(9, 13, 10, 0.98) 64%),
    #0a0e0a;
  transition: opacity 1.15s cubic-bezier(.4,0,.2,1), visibility 1.15s;
}

.loading.done { opacity: 0; visibility: hidden; pointer-events: none; }

.loading-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  padding: 28px;
  text-align: center;
}

.loading-mark {
  display: flex;
  align-items: flex-end;
  gap: 5px;
  height: 23px;
  margin-bottom: 20px;
  opacity: 0.8;
}

.loading-mark span {
  display: block;
  width: 1px;
  height: 100%;
  background: linear-gradient(180deg, rgba(232,176,108,0), var(--amber));
  transform-origin: 50% 100%;
  animation: breathe 2.4s ease-in-out infinite;
}

.loading-mark span:nth-child(1) { height: 58%; animation-delay: -0.5s; }
.loading-mark span:nth-child(2) { height: 100%; animation-delay: -1.1s; }
.loading-mark span:nth-child(3) { height: 74%; animation-delay: -1.8s; }

.loading-title {
  margin: 0;
  font-family: var(--serif);
  font-size: 1.3rem;
  font-weight: 400;
  letter-spacing: -0.01em;
  color: rgba(237, 231, 217, 0.72);
}

.loading-note {
  margin: 10px 0 0;
  font-size: 0.58rem;
  font-weight: 500;
  line-height: 1.5;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(237, 231, 217, 0.34);
  transition: color .4s ease;
}

.loading-note.error { color: rgba(224, 157, 108, 0.86); letter-spacing: 0.08em; text-transform: none; font-size: .7rem; }

.loading-line {
  width: 62px;
  height: 1px;
  margin-top: 26px;
  overflow: hidden;
  background: rgba(237, 231, 217, 0.08);
}

.loading-line i {
  display: block;
  width: 38%;
  height: 100%;
  background: rgba(232, 176, 108, 0.8);
  animation: load-slide 1.7s cubic-bezier(.55,.1,.25,.9) infinite;
}

.noscript {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  padding: 30px;
  background: #0e130e;
  color: var(--paper);
  font-family: var(--serif);
  text-align: center;
}

@keyframes breathe {
  0%, 100% { transform: scaleY(0.72); opacity: .35; }
  50% { transform: scaleY(1); opacity: .95; }
}

@keyframes load-slide {
  0% { transform: translateX(-110%); }
  55%, 100% { transform: translateX(270%); }
}

@media (max-width: 720px) {
  .title-block {
    top: max(22px, calc(env(safe-area-inset-top) + 18px));
    left: 20px;
  }

  .eyebrow { font-size: 0.53rem; letter-spacing: 0.24em; margin-bottom: 10px; }
  .eyebrow .rule { width: 20px; }
  h1 { font-size: clamp(2rem, 9.2vw, 2.8rem); }
  .subtitle { font-size: 0.72rem; margin-top: 8px; }

  .hint {
    left: 20px;
    right: 20px;
    bottom: max(66px, calc(env(safe-area-inset-bottom) + 62px));
    justify-content: flex-start;
    gap: 14px;
    transform: translateY(8px);
    font-size: 0.52rem;
    letter-spacing: 0.14em;
    white-space: normal;
  }

  body.ready .hint { transform: translateY(0); }
  .hint span + span::before { margin-right: 14px; }
  .hint-lantern { display: none; }

  .lantern-ui {
    right: 18px;
    bottom: max(16px, calc(env(safe-area-inset-bottom) + 13px));
    font-size: 0.55rem;
    min-height: 32px;
    padding: 0 12px;
  }

  .caption {
    left: 20px;
    bottom: max(106px, calc(env(safe-area-inset-bottom) + 100px));
    font-size: 0.78rem;
    max-width: 76vw;
  }
}

@media (max-height: 460px) {
  .title-block { top: 18px; }
  .subtitle { display: none; }
  .hint { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
  .title-block, .hint, .lantern-ui { transition-duration: 0.01ms !important; }
}

<body>
  <main id="app">
    <canvas id="scene" aria-label="An interactive view of a warm log cabin in a misty forest at golden hour."></canvas>
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="title-block">
      <p class="eyebrow"><span class="rule"></span>At the edge of the pines</p>
      <h1>Forest Cabin</h1>
      <p class="subtitle">Cedar Hollow · late in the day</p>
    </header>

    <div class="hint" id="hint">
      <span>Drag to look</span>
      <span>Scroll to zoom</span>
      <span class="hint-lantern">Click the lantern</span>
    </div>

    <button class="lantern-ui" id="lanternButton" type="button" aria-pressed="true" title="Toggle the porch lantern (L)">
      <span class="lamp-dot" aria-hidden="true"></span>
      <span class="lamp-label">Lantern</span>
      <span class="lamp-state" id="lanternState">on</span>
    </button>

    <div class="caption" id="caption" role="status" aria-live="polite"></div>

    <div class="loading" id="loading">
      <div class="loading-inner">
        <div class="loading-mark" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <p class="loading-title">Forest Cabin</p>
        <p class="loading-note" id="loadingNote">entering the clearing</p>
        <div class="loading-line" aria-hidden="true"><i></i></div>
      </div>
    </div>
    <noscript><div class="noscript">This scene needs JavaScript and WebGL enabled.</div></noscript>
  </main>

  <script>
    // A small safety net: the page is module-based, so surface loading failures.
    window.__APP_STARTED__ = false;
    window.__APP_ERROR__ = null;
    window.addEventListener('error', function (event) {
      window.__APP_ERROR__ = String((event && event.message) || 'Unknown error');
    });
    window.addEventListener('unhandledrejection', function (event) {
      window.__APP_ERROR__ = String((event && event.reason && event.reason.message) || event.reason || 'Module loading failed');
    });
    setTimeout(function () {
      if (!window.__APP_STARTED__) {
        var note = document.getElementById('loadingNote');
        if (note) {
          note.textContent = 'The woods are slow to arrive — check your connection and refresh.';
          note.classList.add('error');
        }
      }
    }, 14000);
  </script>
  <script type="module">
/* ==========================================================================
   FOREST CABIN
   A procedural, hand-built Three.js clearing at golden hour.
   No external models, textures or images 鈥?everything below is generated
   from geometry, canvas painting and noise.

   Sections
     00 路 configuration
     01 路 helpers + noise
     02 路 procedural textures
     03 路 renderer, camera, sky, light
     04 路 terrain + path
     05 路 the cabin
     06 路 forest
     07 路 ground details + props
     08 路 atmosphere (smoke, dust, mist, fireflies)
     09 路 post processing
     10 路 interface + interaction
     11 路 animation loop
   ========================================================================== */

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

window.__APP_STARTED__ = true;

/* ==========================================================================
   00 路 CONFIGURATION
   ========================================================================== */

const QUERY = new URLSearchParams(window.location.search);
const QA = QUERY.has('qa');
const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOUCH = window.matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;

const CONFIG = {
  seed: 1927,
  colors: {
    fog: 0xb7b5a3,
    skyTop: 0x64818f,
    skyHorizon: 0xe8c99b,
    skyHaze: 0xc3c1aa,
    sun: 0xffbb78,
    fill: 0xa4c3d3,
    bounce: 0xffc07a,
    hemiSky: 0x9bbac9,
    hemiGround: 0x68533f,
    pineDark: 0x263b31,
    pineMid: 0x3e5741,
    pineLight: 0x5c704c,
    moss: 0x67744b,
    dryGrass: 0x9a8d62,
    wood: 0x7c573b,
    stone: 0x848075,
    path: 0x947557,
  },
  render: {
    exposure: 1.22,
    pixelRatioDesktop: 1.6,
    pixelRatioMobile: 1.3,
    bloomStrength: 0.2,
    bloomRadius: 0.52,
    bloomThreshold: 0.89,
    shadowMap: 2048,
    msaaSamples: TOUCH ? 2 : 4,
  },
  fogDensity: 0.0118,
  camera: {
    near: 0.08,
    far: 230,
    fovWide: 36,
    fovMid: 42,
    fovTall: 55,
    eye: 1.72,
  },
  cabin: {
    center: new THREE.Vector3(4.0, 0, -5.6),
    width: 7.0,
    depth: 5.2,
    foundation: 0.62,
    logRadius: 0.165,
    rows: 9,
    rowGap: 0.305,
    doorX: -1.0,
    doorW: 1.0,
    doorH: 2.12,
    frontWindowX: 1.32,
    frontWindowY: 2.18,
    frontWindowW: 1.28,
    frontWindowH: 1.12,
    sideWindowZ: 0.62,
    sideWindowY: 2.16,
    sideWindowW: 0.92,
    sideWindowH: 0.98,
  },
  quality: {
    adaptive: !QA,
    minPixelRatio: 1.0,
    targetFps: 42,
  },
};

const PALETTE = {
  paper: 0xeee7d8,
  amber: 0xffb45f,
  warmWindow: 0xffaf66,
  lantern: 0xffa14f,
  bark: 0x5e4533,
  cutWood: 0xc7a173,
  roof: 0x6b5a49,
  stone: 0x7f7d71,
  terracotta: 0x9a6548,
  iron: 0x35322c,
  cloth: 0xb87857,
  gardenSoil: 0x46382a,
};

/* ==========================================================================
   01 路 HELPERS + NOISE
   ========================================================================== */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const clamp01 = (v) => clamp(v, 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, v) => clamp01((v - a) / (b - a));
const smoothstep = (a, b, v) => {
  const t = invLerp(a, b, v);
  return t * t * (3 - 2 * t);
};
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

function createRng(seed) {
  let s = seed >>> 0 || 1;
  return function random() {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hash2(ix, iy, seed = 1) {
  let h = Math.imul(ix | 0, 374761393) + Math.imul(iy | 0, 668265263) + Math.imul(seed | 0, 69069);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

function valueNoise(x, y, seed = 1) {
  const xi = Math.floor(x);
  const yi = Math.floor(y);
  const xf = x - xi;
  const yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi, seed);
  const b = hash2(xi + 1, yi, seed);
  const c = hash2(xi, yi + 1, seed);
  const d = hash2(xi + 1, yi + 1, seed);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}

function fbm(x, y, octaves = 4, seed = 1, lacunarity = 2.0, gain = 0.5) {
  let sum = 0;
  let amp = 0.5;
  let norm = 0;
  let fx = x;
  let fy = y;
  for (let i = 0; i < octaves; i++) {
    sum += amp * valueNoise(fx, fy, seed + i * 17);
    norm += amp;
    amp *= gain;
    fx *= lacunarity;
    fy *= lacunarity;
  }
  return sum / norm;
}

function wrappedHash(ix, iy, period, seed) {
  const px = ((ix % period) + period) % period;
  const py = ((iy % period) + period) % period;
  return hash2(px, py, seed);
}

function tileNoise(x, y, period, seed) {
  const xi = Math.floor(x);
  const yi = Math.floor(y);
  const xf = x - xi;
  const yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const a = wrappedHash(xi, yi, period, seed);
  const b = wrappedHash(xi + 1, yi, period, seed);
  const c = wrappedHash(xi, yi + 1, period, seed);
  const d = wrappedHash(xi + 1, yi + 1, period, seed);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}

function tileFbm(u, v, basePeriod, octaves, seed) {
  let sum = 0;
  let amp = 0.5;
  let norm = 0;
  let p = basePeriod;
  for (let i = 0; i < octaves; i++) {
    sum += amp * tileNoise(u * p, v * p, p, seed + i * 31);
    norm += amp;
    amp *= 0.5;
    p *= 2;
  }
  return sum / norm;
}

function pick(random, array) {
  return array[Math.min(array.length - 1, Math.floor(random() * array.length))];
}

function range(random, a, b) {
  return a + (b - a) * random();
}

function makeCanvas(width, height) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  return canvas;
}

const MAX_ANISO = 8;

function toTexture(canvas, {
  repeatX = 1,
  repeatY = 1,
  srgb = true,
  wrapS = THREE.RepeatWrapping,
  wrapT = THREE.RepeatWrapping,
  aniso = 4,
  minFilter = THREE.LinearMipmapLinearFilter,
  magFilter = THREE.LinearFilter,
} = {}) {
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  texture.wrapS = wrapS;
  texture.wrapT = wrapT;
  texture.repeat.set(repeatX, repeatY);
  texture.anisotropy = Math.min(aniso, MAX_ANISO);
  texture.minFilter = minFilter;
  texture.magFilter = magFilter;
  texture.needsUpdate = true;
  return texture;
}

function addFineSpeckle(ctx, width, height, seed, count, colors, maxSize = 1.8) {
  const random = createRng(seed);
  for (let i = 0; i < count; i++) {
    const c = pick(random, colors);
    ctx.fillStyle = c;
    ctx.globalAlpha = range(random, 0.05, 0.22);
    const x = random() * width;
    const y = random() * height;
    const s = range(random, 0.4, maxSize);
    ctx.fillRect(x, y, s, s);
  }
  ctx.globalAlpha = 1;
}

/* Small reusable geometry buffers ------------------------------------------ */

function makeCrossedBladeGeometry(planes = 3) {
  const positions = [];
  const uvs = [];
  const indices = [];
  for (let p = 0; p < planes; p++) {
    const a = (p / planes) * Math.PI;
    const dx = Math.cos(a) * 0.5;
    const dz = Math.sin(a) * 0.5;
    const base = positions.length / 3;
    positions.push(-dx, 0, -dz, dx, 0, dz, dx, 1, dz, -dx, 1, -dz);
    uvs.push(0, 0, 1, 0, 1, 1, 0, 1);
    indices.push(base, base + 1, base + 2, base, base + 2, base + 3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

function makeBasePlaneGeometry() {
  const geo = new THREE.PlaneGeometry(1, 1, 1, 1);
  geo.translate(0, 0.5, 0);
  return geo;
}

function makeRootedPlaneGeometry() {
  const geo = new THREE.PlaneGeometry(1, 1, 1, 1);
  geo.translate(0.5, 0, 0);
  return geo;
}

const _dummy = new THREE.Object3D();
const _q = new THREE.Quaternion();
const _e = new THREE.Euler();
const IDENTITY_Q = new THREE.Quaternion();
const ONE_VEC = new THREE.Vector3(1, 1, 1);

function makeInstanced(geometry, material, items, options = {}) {
  const { castShadow = false, receiveShadow = false, frustumCulled = false } = options;
  const mesh = new THREE.InstancedMesh(geometry, material, items.length);
  mesh.castShadow = castShadow;
  mesh.receiveShadow = receiveShadow;
  mesh.frustumCulled = frustumCulled;
  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    _dummy.position.copy(item.p);
    _dummy.quaternion.copy(item.q || IDENTITY_Q);
    _dummy.scale.copy(item.s || ONE_VEC);
    _dummy.updateMatrix();
    mesh.setMatrixAt(i, _dummy.matrix);
    if (item.c) mesh.setColorAt(i, item.c);
  }
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.computeBoundingSphere();
  return mesh;
}

function quatFromEuler(x, y, z, order = 'YXZ') {
  _e.set(x, y, z, order);
  return new THREE.Quaternion().setFromEuler(_e);
}

function randomQuat(random) {
  return quatFromEuler(
    range(random, -0.55, 0.55),
    random() * TAU,
    range(random, -0.4, 0.4),
    'YXZ'
  );
}

/* Wind ------------------------------------------------------------------- */

const windTime = { value: 0 };

function addWind(material, { amplitude = 0.03, speed = 1.0, bend = '1.0', phase = 0.0, key = 'a' } = {}) {
  const compile = (shader) => {
    shader.uniforms.uWindTime = windTime;
    shader.uniforms.uWindAmp = { value: amplitude };
    shader.uniforms.uWindSpeed = { value: speed };
    shader.uniforms.uWindPhase = { value: phase };
    shader.vertexShader = shader.vertexShader
      .replace(
        '#include <common>',
        `#include <common>
        uniform float uWindTime;
        uniform float uWindAmp;
        uniform float uWindSpeed;
        uniform float uWindPhase;`
      )
      .replace(
        '#include <begin_vertex>',
        `#include <begin_vertex>
        #ifdef USE_INSTANCING
          vec2 windAnchor = vec2(instanceMatrix[3][0], instanceMatrix[3][2]);
        #else
          vec2 windAnchor = vec2(0.0);
        #endif
        float windT = uWindTime * uWindSpeed;
        float bendAmount = ${bend};
        float swayA = sin(windT * 1.15 + windAnchor.x * 0.72 + windAnchor.y * 0.51 + position.y * 1.9 + uWindPhase);
        float swayB = sin(windT * 2.07 + windAnchor.y * 0.91 + position.x * 1.3 + uWindPhase * 1.7);
        transformed.x += (swayA * 0.72 + swayB * 0.28) * uWindAmp * bendAmount;
        transformed.z += (cos(windT * 0.93 + windAnchor.x * 0.58 + position.y * 1.2) * 0.55) * uWindAmp * bendAmount * 0.8;`
      );
  };
  material.onBeforeCompile = compile;
  material.customProgramCacheKey = () => `wind-${key}-${amplitude}-${speed}-${bend}-${phase}`;
}

/* ==========================================================================
   02 路 PROCEDURAL TEXTURES
   ========================================================================== */

function createGroundTextures() {
  const S = 512;
  const canvas = makeCanvas(S, S);
  const ctx = canvas.getContext('2d');
  const image = ctx.createImageData(S, S);
  const data = image.data;

  const bumpCanvas = makeCanvas(256, 256);
  const bumpCtx = bumpCanvas.getContext('2d');
  const bumpImage = bumpCtx.createImageData(256, 256);
  const bumpData = bumpImage.data;

  for (let y = 0; y < S; y++) {
    const v = y / S;
    for (let x = 0; x < S; x++) {
      const u = x / S;
      const broad = tileFbm(u, v, 4, 3, 11);
      const mid = tileFbm(u, v, 16, 2, 41);
      const fine = tileFbm(u, v, 52, 2, 73);
      const moss = smoothstep(0.51, 0.73, mid);
      const dry = smoothstep(0.55, 0.81, broad);
      let r = 86 + (broad - 0.5) * 38 + (fine - 0.5) * 24;
      let g = 81 + (broad - 0.5) * 34 + (fine - 0.5) * 21;
      let b = 60 + (broad - 0.5) * 28 + (fine - 0.5) * 15;
      r = lerp(r, 87, moss * 0.56);
      g = lerp(g, 100, moss * 0.56);
      b = lerp(b, 62, moss * 0.56);
      r = lerp(r, 117, dry * 0.18);
      g = lerp(g, 105, dry * 0.18);
      b = lerp(b, 73, dry * 0.18);
      const i = (y * S + x) * 4;
      data[i] = r;
      data[i + 1] = g;
      data[i + 2] = b;
      data[i + 3] = 255;
    }
  }
  ctx.putImageData(image, 0, 0);

  // Fine fibers, tiny leaves, and grit 鈥?readable at the camera's eye level.
  const random = createRng(917);
  const grassColors = ['rgba(92,106,63,0.26)', 'rgba(128,128,86,0.25)', 'rgba(61,78,51,0.26)', 'rgba(143,129,88,0.18)'];
  for (let i = 0; i < 1900; i++) {
    const x = random() * S;
    const y = random() * S;
    const len = range(random, 1.5, 8);
    ctx.strokeStyle = pick(random, grassColors);
    ctx.lineWidth = range(random, 0.5, 1.2);
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + range(random, -2, 2), y - len * 0.5, x + range(random, -4, 4), y - len);
    ctx.stroke();
  }

  for (let i = 0; i < 260; i++) {
    ctx.fillStyle = pick(random, ['rgba(126,88,54,0.28)', 'rgba(95,72,45,0.32)', 'rgba(150,111,64,0.2)']);
    ctx.beginPath();
    ctx.ellipse(random() * S, random() * S, range(random, 0.8, 2.5), range(random, 0.5, 1.4), random() * TAU, 0, TAU);
    ctx.fill();
  }

  for (let i = 0; i < 26; i++) {
    const x = random() * S;
    const y = random() * S;
    ctx.strokeStyle = 'rgba(70,53,36,0.3)';
    ctx.lineWidth = range(random, 0.6, 1.4);
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + range(random, -14, 14), y + range(random, -9, 9));
    ctx.stroke();
  }

  addFineSpeckle(ctx, S, S, 151, 900, ['#4d4e35', '#73634a', '#8a7a5a', '#3d4632'], 1.6);

  // Sparse mottled lichen.
  for (let i = 0; i < 34; i++) {
    const x = random() * S;
    const y = random() * S;
    const r = range(random, 2, 9);
    const gradient = ctx.createRadialGradient(x, y, 0, x, y, r);
    gradient.addColorStop(0, 'rgba(137,145,96,0.3)');
    gradient.addColorStop(1, 'rgba(137,145,96,0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
  }

  // Bump texture uses a similar layering without color.
  for (let y = 0; y < 256; y++) {
    const v = y / 256;
    for (let x = 0; x < 256; x++) {
      const u = x / 256;
      const n = tileFbm(u, v, 14, 3, 27) * 0.65 + tileFbm(u, v, 44, 2, 65) * 0.35;
      const value = Math.round(94 + (n - 0.5) * 130);
      const i = (y * 256 + x) * 4;
      bumpData[i] = value;
      bumpData[i + 1] = value;
      bumpData[i + 2] = value;
      bumpData[i + 3] = 255;
    }
  }
  bumpCtx.putImageData(bumpImage, 0, 0);

  const map = toTexture(canvas, { repeatX: 13, repeatY: 13, aniso: 8 });
  const bump = toTexture(bumpCanvas, { repeatX: 13, repeatY: 13, srgb: false, aniso: 4 });
  return { map, bump };
}

function createPathTexture() {
  const S = 512;
  const canvas = makeCanvas(S, S);
  const ctx = canvas.getContext('2d');
  const image = ctx.createImageData(S, S);
  const data = image.data;
  for (let y = 0; y < S; y++) {
    const v = y / S;
    for (let x = 0; x < S; x++) {
      const u = x / S;
      const n = tileFbm(u, v, 8, 3, 127);
      const fine = tileFbm(u, v, 34, 2, 191);
      const edgeNoise = (tileFbm(u, v, 3, 2, 251) - 0.5) * 0.12;
      const edge = Math.abs(u - 0.5) + edgeNoise;
      const alpha = 1 - smoothstep(0.36, 0.49, edge);
      let r = 125 + (n - 0.5) * 42 + (fine - 0.5) * 24;
      let g = 99 + (n - 0.5) * 32 + (fine - 0.5) * 18;
      let b = 73 + (n - 0.5) * 24 + (fine - 0.5) * 14;
      const damp = smoothstep(0.54, 0.78, n);
      r = lerp(r, 98, damp * 0.28);
      g = lerp(g, 82, damp * 0.24);
      b = lerp(b, 59, damp * 0.24);
      const i = (y * S + x) * 4;
      data[i] = r;
      data[i + 1] = g;
      data[i + 2] = b;
      data[i + 3] = Math.round(alpha * 255);
    }
  }
  ctx.putImageData(image, 0, 0);

  const random = createRng(388);
  for (let i = 0; i < 95; i++) {
    const u = range(random, 0.14, 0.86);
    const v = random();
    const x = u * S;
    const y = v * S;
    const r = range(random, 1.2, 4.6);
    ctx.fillStyle = pick(random, ['rgba(112,97,78,0.5)', 'rgba(82,75,63,0.45)', 'rgba(153,133,104,0.4)', 'rgba(66,60,50,0.4)']);
    ctx.beginPath();
    ctx.ellipse(x, y, r, r * range(random, 0.45, 0.8), random() * TAU, 0, TAU);
    ctx.fill();
  }
  for (let i = 0; i < 50; i++) {
    const u = range(random, 0.17, 0.83);
    const x = u * S;
    const y = random() * S;
    ctx.strokeStyle = 'rgba(81,64,44,0.44)';
    ctx.lineWidth = range(random, 0.7, 1.5);
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + range(random, -8, 8), y + range(random, -4, 4));
    ctx.stroke();
  }
  addFineSpeckle(ctx, 470, S, 442, 700, ['#7a654c', '#634f3b', '#a18b68', '#4c4534'], 1.5);

  const map = toTexture(canvas, {
    repeatX: 1,
    repeatY: 1,
    wrapS: THREE.ClampToEdgeWrapping,
    wrapT: THREE.RepeatWrapping,
    aniso: 8,
  });
  return map;
}

function createWoodTexture() {
  const S = 512;
  const canvas = makeCanvas(S, S);
  const ctx = canvas.getContext('2d');
  const random = createRng(731);

  const base = ctx.createLinearGradient(0, 0, S, 0);
  base.addColorStop(0, '#5a3f2d');
  base.addColorStop(0.26, '#6d4c34');
  base.addColorStop(0.58, '#62452f');
  base.addColorStop(1, '#513726');
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, S, S);

  // Broad tonal bands in the bark.
  for (let i = 0; i < 20; i++) {
    ctx.fillStyle = i % 2 ? 'rgba(158,113,73,0.06)' : 'rgba(40,27,18,0.08)';
    const x = random() * S;
    ctx.fillRect(x, 0, range(random, 9, 55), S);
  }

  // Long grain.
  for (let i = 0; i < 300; i++) {
    const x = random() * S;
    const wiggle = range(random, 1, 8);
    const dark = random() > 0.54;
    ctx.strokeStyle = dark ? `rgba(36,23,15,${range(random, 0.04, 0.18)})` : `rgba(192,148,102,${range(random, 0.03, 0.12)})`;
    ctx.lineWidth = range(random, 0.4, 1.8);
    ctx.beginPath();
    ctx.moveTo(x + range(random, -3, 3), -10);
    ctx.bezierCurveTo(
      x + range(random, -wiggle, wiggle), S * 0.3,
      x + range(random, -wiggle, wiggle), S * 0.7,
      x + range(random, -3, 3), S + 10
    );
    ctx.stroke();
  }

  // Knots and shallow cracks.
  for (let k = 0; k < 3; k++) {
    const x = range(random, 70, S - 70);
    const y = range(random, 70, S - 70);
    for (let ring = 5; ring >= 1; ring--) {
      ctx.strokeStyle = `rgba(41,25,15,${0.1 + (5 - ring) * 0.035})`;
      ctx.lineWidth = 1 + ring * 0.38;
      ctx.beginPath();
      ctx.ellipse(x, y, 5 + ring * 4.6, 11 + ring * 7.5, range(random, -0.25, 0.25), 0, TAU);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(36,22,13,0.38)';
    ctx.beginPath();
    ctx.ellipse(x, y, 4, 10, 0.2, 0, TAU);
    ctx.fill();
  }
  for (let c = 0; c < 6; c++) {
    let x = range(random, 20, S - 20);
    let y = random() * S * 0.75;
    ctx.strokeStyle = 'rgba(28,18,12,0.24)';
    ctx.lineWidth = range(random, 0.8, 1.9);
    ctx.beginPath();
    ctx.moveTo(x, y);
    for (let s = 0; s < 5; s++) {
      x += range(random, -2.5, 2.5);
      y += range(random, 6, 18);
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  for (let i = 0; i < 1200; i++) {
    ctx.fillStyle = pick(random, ['#825c3d', '#4b3324', '#a37c55', '#6b4b32']);
    ctx.globalAlpha = range(random, 0.04, 0.16);
    ctx.fillRect(random() * S, random() * S, range(random, 0.5, 2), range(random, 0.5, 2.2));
  }
  ctx.globalAlpha = 1;

  return toTexture(canvas, { repeatX: 1, repeatY: 2.2, aniso: 8 });
}

function createBarkTexture() {
  const S = 512;
  const canvas = makeCanvas(S, S);
  const ctx = canvas.getContext('2d');
  const random = createRng(553);
  ctx.fillStyle = '#4a3729';
  ctx.fillRect(0, 0, S, S);

  for (let i = 0; i < 80; i++) {
    const x = random() * S;
    ctx.strokeStyle = pick(random, [
      `rgba(26,20,15,${range(random, 0.2, 0.5)})`,
      `rgba(127,98,66,${range(random, 0.12, 0.34)})`,
      `rgba(82,68,51,${range(random, 0.15, 0.34)})`,
    ]);
    ctx.lineWidth = range(random, 1, 7);
    ctx.beginPath();
    ctx.moveTo(x, -20);
    for (let y = 0; y <= S + 20; y += 32) {
      ctx.lineTo(x + range(random, -7, 7), y);
    }
    ctx.stroke();
  }

  for (let i = 0; i < 120; i++) {
    const x = random() * S;
    const y = random() * S;
    ctx.strokeStyle = `rgba(26,18,12,${range(random, 0.08, 0.26)})`;
    ctx.lineWidth = range(random, 0.5, 1.6);
    ctx.beginPath();
    ctx.ellipse(x, y, range(random, 2, 8), range(random, 1, 4), random() * TAU, 0, Math.PI * 1.5);
    ctx.stroke();
  }

  // Lichen / moss patches on bark.
  for (let i = 0; i < 55; i++) {
    const x = random() * S;
    const y = random() * S;
    const r = range(random, 2, 10);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, pick(random, ['rgba(120,129,85,0.34)', 'rgba(105,116,75,0.3)', 'rgba(150,144,99,0.24)']));
    g.addColorStop(1, 'rgba(100,110,72,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
  }

  addFineSpeckle(ctx, S, S, 61, 1000, ['#2d2118', '#8d7657', '#6d5c45', '#a18a63'], 1.4);
  return toTexture(canvas, { repeatX: 1.5, repeatY: 1.6, aniso: 8 });
}

function createPlankTexture(direction = 'horizontal') {
  const S = 512;
  const canvas = makeCanvas(S, S);
  const ctx = canvas.getContext('2d');
  const random = createRng(direction === 'horizontal' ? 442 : 849);
  ctx.fillStyle = direction === 'horizontal' ? '#654832' : '#5c412e';
  ctx.fillRect(0, 0, S, S);

  const count = 7;
  const step = S / count;
  for (let i = 0; i < count; i++) {
    const shade = range(random, -0.1, 0.12);
    const c = new THREE.Color().setHSL(0.08 + range(random, -0.015, 0.015), 0.28, 0.31 + shade);
    ctx.fillStyle = '#' + c.getHexString();
    if (direction === 'horizontal') ctx.fillRect(0, i * step + 1.4, S, step - 2.8);
    else ctx.fillRect(i * step + 1.4, 0, step - 2.8, S);

    // grain
    for (let g = 0; g < 95; g++) {
      ctx.strokeStyle = random() > 0.55 ? `rgba(28,17,10,${range(random, 0.04, 0.16)})` : `rgba(190,145,100,${range(random, 0.03, 0.1)})`;
      ctx.lineWidth = range(random, 0.4, 1.4);
      ctx.beginPath();
      if (direction === 'horizontal') {
        const y = i * step + range(random, 4, step - 4);
        ctx.moveTo(-5, y);
        ctx.bezierCurveTo(S * 0.3, y + range(random, -2, 2), S * 0.7, y + range(random, -2, 2), S + 5, y + range(random, -1.5, 1.5));
      } else {
        const x = i * step + range(random, 4, step - 4);
        ctx.moveTo(x, -5);
        ctx.bezierCurveTo(x + range(random, -2, 2), S * 0.3, x + range(random, -2, 2), S * 0.7, x + range(random, -1.5, 1.5), S + 5);
      }
      ctx.stroke();
    }

    // seams & nails
    ctx.fillStyle = 'rgba(20,13,9,0.58)';
    if (direction === 'horizontal') ctx.fillRect(0, i * step, S, 2);
    else ctx.fillRect(i * step, 0, 2, S);
    if (random() > 0.42) {
      const px = direction === 'horizontal' ? range(random, 12, S - 12) : i * step + step * 0.5;
      const py = direction === 'horizontal' ? i * step + step * 0.5 : range(random, 12, S - 12);
      ctx.fillStyle = 'rgba(31,25,20,0.55)';
      ctx.beginPath();
      ctx.arc(px, py, 1.7, 0, TAU);
      ctx.fill();
    }
  }

  for (let i = 0; i < 550; i++) {
    ctx.fillStyle = pick(random, ['#8a6947', '#3f2c1e', '#a8855e', '#5e402b']);
    ctx.globalAlpha = range(random, 0.03, 0.14);
    ctx.fillRect(random() * S, random() * S, range(random, 0.5, 1.8), range(random, 0.5, 1.8));
  }
  ctx.globalAlpha = 1;
  return toTexture(canvas, { repeatX: 1, repeatY: 1, aniso: 8 });
}

function createStoneTexture() {
  const S = 512;
  const canvas = makeCanvas(S, S);
  const ctx = canvas.getContext('2d');
  const random = createRng(1209);
  ctx.fillStyle = '#56544a';
  ctx.fillRect(0, 0, S, S);

  // A subtle dark mortar noise.
  for (let i = 0; i < 2200; i++) {
    ctx.fillStyle = pick(random, ['#45443c', '#68665b', '#4a473e', '#5d594e']);
    ctx.globalAlpha = range(random, 0.05, 0.18);
    ctx.fillRect(random() * S, random() * S, range(random, 1, 4), range(random, 1, 3));
  }
  ctx.globalAlpha = 1;

  const rows = 7;
  const rowH = S / rows;
  for (let row = 0; row < rows; row++) {
    let x = -range(random, 0, 80);
    const yCenter = row * rowH + rowH * 0.5;
    while (x < S + 20) {
      const w = range(random, 46, 112);
      const h = rowH * range(random, 0.72, 0.94);
      const cy = yCenter + range(random, -5, 5);
      const points = 8;
      ctx.beginPath();
      for (let p = 0; p < points; p++) {
        const a = (p / points) * TAU;
        const rr = 0.5 + range(random, -0.09, 0.09);
        const px = x + w * 0.5 + Math.cos(a) * w * 0.5 * rr;
        const py = cy + Math.sin(a) * h * 0.5 * rr;
        if (p === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      const tone = range(random, 0, 1);
      const stoneColor = tone < 0.35 ? '#76756b' : tone < 0.7 ? '#8c897d' : tone < 0.9 ? '#686b61' : '#9b9587';
      ctx.fillStyle = stoneColor;
      ctx.fill();
      ctx.strokeStyle = 'rgba(38,37,32,0.48)';
      ctx.lineWidth = range(random, 1.2, 2.6);
      ctx.stroke();

      // Top-left key light and lower shadow.
      ctx.save();
      ctx.clip();
      const grad = ctx.createLinearGradient(x, cy - h * 0.5, x + w, cy + h * 0.5);
      grad.addColorStop(0, 'rgba(218,212,194,0.12)');
      grad.addColorStop(0.45, 'rgba(255,255,255,0)');
      grad.addColorStop(1, 'rgba(34,32,26,0.18)');
      ctx.fillStyle = grad;
      ctx.fillRect(x, cy - h * 0.7, w, h * 1.4);
      for (let s = 0; s < 16; s++) {
        ctx.fillStyle = random() > 0.5 ? 'rgba(230,225,208,0.1)' : 'rgba(33,31,26,0.13)';
        ctx.beginPath();
        ctx.arc(x + random() * w, cy + range(random, -h * 0.45, h * 0.45), range(random, 0.5, 3), 0, TAU);
        ctx.fill();
      }
      if (random() > 0.48) {
        const mx = x + random() * w;
        const my = cy + range(random, -h * 0.4, h * 0.35);
        const mr = range(random, 3, 16);
        const mg = ctx.createRadialGradient(mx, my, 0, mx, my, mr);
        mg.addColorStop(0, 'rgba(103,118,73,0.38)');
        mg.addColorStop(1, 'rgba(103,118,73,0)');
        ctx.fillStyle = mg;
        ctx.beginPath();
        ctx.arc(mx, my, mr, 0, TAU);
        ctx.fill();
      }
      ctx.restore();
      x += w + range(random, 4, 13);
    }
  }

  addFineSpeckle(ctx, S, S, 811, 1500, ['#4f4d44', '#9c9789', '#393832', '#b3ac9b'], 1.7);
  return toTexture(canvas, { repeatX: 2.2, repeatY: 1.2, aniso: 8 });
}

function createRoofTexture() {
  const S = 512;
  const canvas = makeCanvas(S, S);
  const ctx = canvas.getContext('2d');
  const random = createRng(335);
  ctx.fillStyle = '#3f3429';
  ctx.fillRect(0, 0, S, S);

  const rows = 9;
  const rowH = S / rows;
  const tones = ['#665445', '#5b4a3d', '#715b48', '#55463a', '#7a6550', '#4d4035'];
  for (let row = 0; row < rows; row++) {
    const y = row * rowH;
    const offset = row % 2 ? -24 : 0;
    let x = offset;
    while (x < S) {
      const w = range(random, 48, 78);
      const h = rowH * range(random, 0.8, 0.96);
      ctx.fillStyle = pick(random, tones);
      ctx.beginPath();
      ctx.roundRect(x + 1.5, y + 1.2, w - 3, h - 1.2, [1.5, 1.5, 5, 5]);
      ctx.fill();
      ctx.strokeStyle = 'rgba(27,22,17,0.46)';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      ctx.save();
      ctx.clip();
      for (let g = 0; g < 9; g++) {
        ctx.strokeStyle = random() > 0.48 ? 'rgba(33,26,20,0.14)' : 'rgba(213,190,156,0.07)';
        ctx.lineWidth = range(random, 0.5, 1.2);
        const gy = y + range(random, 4, h - 3);
        ctx.beginPath();
        ctx.moveTo(x, gy);
        ctx.lineTo(x + w, gy + range(random, -3, 3));
        ctx.stroke();
      }
      for (let m = 0; m < 3; m++) {
        if (random() > 0.6) {
          const mx = x + random() * w;
          const my = y + random() * h;
          const mg = ctx.createRadialGradient(mx, my, 0, mx, my, range(random, 2, 8));
          mg.addColorStop(0, 'rgba(100,113,73,0.34)');
          mg.addColorStop(1, 'rgba(100,113,73,0)');
          ctx.fillStyle = mg;
          ctx.beginPath();
          ctx.arc(mx, my, 8, 0, TAU);
          ctx.fill();
        }
      }
      ctx.restore();
      x += w - 1;
    }
    ctx.fillStyle = 'rgba(21,17,13,0.42)';
    ctx.fillRect(0, y, S, 2.2);
  }

  for (let i = 0; i < 45; i++) {
    const x = random() * S;
    const y = random() * S;
    ctx.fillStyle = pick(random, ['rgba(130,117,83,0.28)', 'rgba(87,95,60,0.35)', 'rgba(66,83,56,0.34)']);
    ctx.beginPath();
    ctx.ellipse(x, y, range(random, 1, 6), range(random, 0.8, 3.5), random() * TAU, 0, TAU);
    ctx.fill();
  }

  return toTexture(canvas, { repeatX: 2.6, repeatY: 1.8, aniso: 8 });
}

function createCutWoodTexture() {
  const S = 256;
  const canvas = makeCanvas(S, S);
  const ctx = canvas.getContext('2d');
  const random = createRng(290);
  ctx.fillStyle = '#b28b5e';
  ctx.fillRect(0, 0, S, S);
  const cx = S * 0.5;
  const cy = S * 0.5;
  for (let r = 8; r < 122; r += range(random, 4, 9)) {
    ctx.strokeStyle = `rgba(81,54,31,${range(random, 0.14, 0.34)})`;
    ctx.lineWidth = range(random, 0.7, 1.8);
    ctx.beginPath();
    for (let a = 0; a <= TAU + 0.1; a += 0.18) {
      const rr = r * (1 + Math.sin(a * 3 + r) * 0.035);
      const x = cx + Math.cos(a) * rr;
      const y = cy + Math.sin(a) * rr;
      if (a === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  for (let c = 0; c < 6; c++) {
    const a = random() * TAU;
    ctx.strokeStyle = 'rgba(58,37,20,0.38)';
    ctx.lineWidth = range(random, 1, 2.2);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * 118, cy + Math.sin(a) * 118);
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(52,37,23,0.5)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, 126, 0, TAU);
  ctx.stroke();
  return toTexture(canvas, { repeatX: 1, repeatY: 1, aniso: 4 });
}

function createWindowTexture(front = true) {
  const S = 512;
  const canvas = makeCanvas(S, S);
  const ctx = canvas.getContext('2d');
  const random = createRng(front ? 51 : 52);
  ctx.fillStyle = '#25170f';
  ctx.fillRect(0, 0, S, S);

  // Warm interior glow.
  const glow = ctx.createRadialGradient(S * 0.5, S * 0.62, 8, S * 0.5, S * 0.55, S * 0.74);
  glow.addColorStop(0, '#ffd59d');
  glow.addColorStop(0.18, '#ffbd79');
  glow.addColorStop(0.42, '#d88a4d');
  glow.addColorStop(0.72, '#7f4b2f');
  glow.addColorStop(1, '#322016');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, S, S);

  // Inner ceiling / wall.
  ctx.fillStyle = 'rgba(53,31,20,0.6)';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(S, 0);
  ctx.lineTo(S, S * 0.2);
  ctx.quadraticCurveTo(S * 0.5, S * 0.12, 0, S * 0.23);
  ctx.fill();

  // Table silhouette and a cup.
  ctx.fillStyle = 'rgba(37,21,13,0.58)';
  ctx.fillRect(S * 0.16, S * 0.7, S * 0.68, S * 0.055);
  ctx.fillRect(S * 0.23, S * 0.755, S * 0.042, S * 0.16);
  ctx.fillRect(S * 0.74, S * 0.755, S * 0.042, S * 0.16);
  ctx.fillStyle = 'rgba(49,27,16,0.72)';
  ctx.beginPath();
  ctx.ellipse(S * 0.66, S * 0.66, S * 0.07, S * 0.035, 0, 0, TAU);
  ctx.fill();
  ctx.fillRect(S * 0.62, S * 0.6, S * 0.08, S * 0.08);

  // A little plant / vase on the sill.
  ctx.strokeStyle = 'rgba(35,39,23,0.75)';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(S * 0.28, S * 0.7);
  ctx.quadraticCurveTo(S * 0.24, S * 0.58, S * 0.31, S * 0.5);
  ctx.moveTo(S * 0.29, S * 0.69);
  ctx.quadraticCurveTo(S * 0.36, S * 0.55, S * 0.31, S * 0.48);
  ctx.stroke();
  ctx.fillStyle = 'rgba(37,44,25,0.8)';
  for (let i = 0; i < 6; i++) {
    ctx.beginPath();
    ctx.ellipse(S * 0.28 + (random() - 0.5) * S * 0.1, S * 0.54 + (random() - 0.5) * S * 0.1, 10, 4, random() * TAU, 0, TAU);
    ctx.fill();
  }

  // Curtains 鈥?translucent, slightly irregular.
  const curtain = ctx.createLinearGradient(0, 0, S * 0.25, 0);
  curtain.addColorStop(0, 'rgba(238,216,181,0.18)');
  curtain.addColorStop(0.65, 'rgba(243,225,195,0.12)');
  curtain.addColorStop(1, 'rgba(245,226,195,0)');
  ctx.fillStyle = curtain;
  ctx.fillRect(0, 0, S * 0.34, S);
  const curtain2 = ctx.createLinearGradient(S, 0, S * 0.78, 0);
  curtain2.addColorStop(0, 'rgba(231,205,168,0.14)');
  curtain2.addColorStop(1, 'rgba(231,205,168,0)');
  ctx.fillStyle = curtain2;
  ctx.fillRect(S * 0.7, 0, S * 0.3, S);
  for (let i = 0; i < 9; i++) {
    ctx.strokeStyle = `rgba(63,43,26,${range(random, 0.05, 0.18)})`;
    ctx.lineWidth = range(random, 2, 7);
    ctx.beginPath();
    const x = S * range(random, 0.02, 0.22);
    ctx.moveTo(x, 0);
    ctx.quadraticCurveTo(x + range(random, -10, 10), S * 0.45, x + range(random, -8, 8), S);
    ctx.stroke();
  }

  // Glass reflection and vignette.
  const glass = ctx.createLinearGradient(0, 0, S, S);
  glass.addColorStop(0, 'rgba(235,228,206,0.12)');
  glass.addColorStop(0.42, 'rgba(255,255,255,0)');
  glass.addColorStop(0.62, 'rgba(255,248,231,0.045)');
  glass.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = glass;
  ctx.fillRect(0, 0, S, S);
  const vign = ctx.createRadialGradient(S * 0.5, S * 0.5, S * 0.2, S * 0.5, S * 0.5, S * 0.8);
  vign.addColorStop(0, 'rgba(20,10,6,0)');
  vign.addColorStop(1, 'rgba(20,10,6,0.52)');
  ctx.fillStyle = vign;
  ctx.fillRect(0, 0, S, S);

  addFineSpeckle(ctx, S, S, 62, 180, ['#3b2114', '#ffdfa9', '#5a3722'], 1.6);
  return toTexture(canvas, { repeatX: 1, repeatY: 1, aniso: 4 });
}

function createPineBranchTexture() {
  const W = 512;
  const H = 256;
  const canvas = makeCanvas(W, H);
  const ctx = canvas.getContext('2d');
  const random = createRng(722);
  ctx.clearRect(0, 0, W, H);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const rootX = 10;
  const rootY = H * 0.5;
  const tipX = W - 6;
  const tipY = H * 0.44;
  const branchY = (t) => H * 0.5 - Math.sin(t * Math.PI) * H * 0.035 + t * (tipY - rootY);

  // A soft, dark green body under the needles. This survives mipmapping and
  // keeps the branch from disintegrating into a few stray pixels at distance.
  for (let i = 0; i < 120; i++) {
    const t = i / 120;
    const x = lerp(rootX, tipX, t) + range(random, -7, 7);
    const y = branchY(t) + range(random, -18, 12) * (0.75 + Math.sin(t * Math.PI) * 0.25);
    const rx = range(random, 10, 24) * (1 - t * 0.38);
    const ry = range(random, 6, 20) * (0.75 + Math.sin(t * Math.PI) * 0.25);
    const shade = random();
    ctx.fillStyle = shade < 0.35
      ? 'rgba(33,54,39,0.58)'
      : shade < 0.74
        ? 'rgba(49,73,48,0.56)'
        : 'rgba(70,92,56,0.5)';
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, range(random, -0.3, 0.3), 0, TAU);
    ctx.fill();
  }

  // Main stem.
  ctx.strokeStyle = 'rgba(80,59,39,0.92)';
  ctx.lineWidth = 5.2;
  ctx.beginPath();
  ctx.moveTo(rootX, rootY);
  ctx.quadraticCurveTo(W * 0.52, H * 0.54, tipX, tipY);
  ctx.stroke();

  const needlesDark = ['rgba(30,52,38,0.96)', 'rgba(39,61,43,0.92)', 'rgba(24,45,34,0.95)'];
  const needlesMid = ['rgba(62,88,56,0.94)', 'rgba(80,101,61,0.9)', 'rgba(52,76,50,0.94)'];
  const needlesLight = ['rgba(110,128,78,0.82)', 'rgba(137,146,89,0.7)', 'rgba(91,114,68,0.82)'];

  const branches = 34;
  for (let b = 0; b < branches; b++) {
    const t = 0.025 + (b / branches) * 0.95;
    const bx = lerp(rootX, tipX, t) + range(random, -4, 4);
    const by = branchY(t);
    const dir = random() > 0.4 ? -1 : 1;
    const sideLen = (1 - Math.abs(t - 0.3) * 0.58) * H * range(random, 0.3, 0.52);
    const sideAngle = -0.88 + range(random, -0.16, 0.16);

    ctx.strokeStyle = 'rgba(72,52,35,0.82)';
    ctx.lineWidth = range(random, 2.2, 3.4);
    const ex = bx + Math.cos(sideAngle) * sideLen * 0.46;
    const ey = by + dir * Math.sin(sideAngle) * sideLen * 0.46;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.quadraticCurveTo(bx + sideLen * 0.18, by + dir * sideLen * 0.2, ex, ey);
    ctx.stroke();

    for (let n = 0; n < 54; n++) {
      const nt = n / 54;
      const nx = lerp(bx - sideLen * 0.22, bx + sideLen * 0.26, nt) + range(random, -3, 3);
      const ny = by + dir * (Math.sin(nt * Math.PI) * sideLen * 0.5 - 3) + range(random, -9, 9);
      const len = range(random, 11, 30) * (0.55 + Math.sin(nt * Math.PI) * 0.7);
      const ang = dir * (Math.PI * 0.36) + range(random, -0.6, 0.6);
      const shadeRoll = random();
      ctx.strokeStyle = shadeRoll < 0.5 ? pick(random, needlesDark) : shadeRoll < 0.82 ? pick(random, needlesMid) : pick(random, needlesLight);
      ctx.lineWidth = range(random, 2.0, 3.8);
      ctx.beginPath();
      ctx.moveTo(nx, ny);
      ctx.quadraticCurveTo(
        nx + Math.cos(ang) * len * 0.5,
        ny - Math.sin(ang) * len * 0.5,
        nx + Math.cos(ang) * len,
        ny - Math.sin(ang) * len
      );
      ctx.stroke();
    }
  }

  // Extra needles hang along the top and bottom of the main stem.
  for (let n = 0; n < 220; n++) {
    const t = range(random, 0.02, 0.99);
    const nx = lerp(rootX, tipX, t) + range(random, -8, 8);
    const ny = branchY(t) + range(random, -24, 20);
    const ang = range(random, 0, TAU);
    const len = range(random, 8, 22);
    ctx.strokeStyle = pick(random, random() > 0.5 ? needlesMid : needlesDark);
    ctx.lineWidth = range(random, 1.8, 3.4);
    ctx.beginPath();
    ctx.moveTo(nx, ny);
    ctx.lineTo(nx + Math.cos(ang) * len, ny + Math.sin(ang) * len);
    ctx.stroke();
  }

  // Sunlit upper edge and golden tips.
  for (let i = 0; i < 240; i++) {
    const t = range(random, 0.06, 0.99);
    const x = lerp(rootX, tipX, t) + range(random, -22, 22);
    const y = branchY(t) + range(random, -38, 4);
    ctx.fillStyle = `rgba(${Math.round(range(random, 138, 190))},${Math.round(range(random, 142, 176))},${Math.round(range(random, 88, 120))},${range(random, 0.18, 0.5)})`;
    ctx.beginPath();
    ctx.ellipse(x, y, range(random, 1.2, 3.6), range(random, 0.6, 1.8), range(random, -0.5, 0.5), 0, TAU);
    ctx.fill();
  }

  return toTexture(canvas, { wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping, aniso: 4 });
}

function createLeafClusterTexture() {
  const S = 256;
  const canvas = makeCanvas(S, S);
  const ctx = canvas.getContext('2d');
  const random = createRng(621);
  ctx.clearRect(0, 0, S, S);

  const leafColors = ['#2f4a35', '#3d573b', '#4d6541', '#5d7147', '#70804e', '#8b8b55', '#a2975e'];
  for (let i = 0; i < 115; i++) {
    const a = random() * TAU;
    const radius = Math.pow(random(), 0.58) * S * 0.43;
    const x = S * 0.5 + Math.cos(a) * radius;
    const y = S * 0.54 + Math.sin(a) * radius * 0.84;
    const size = range(random, 6, 18);
    const rotation = random() * TAU;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);
    ctx.fillStyle = pick(random, leafColors);
    ctx.globalAlpha = range(random, 0.72, 0.98);
    ctx.beginPath();
    ctx.ellipse(0, 0, size, size * range(random, 0.3, 0.52), 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(223,205,142,0.18)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(-size * 0.8, 0);
    ctx.lineTo(size * 0.8, 0);
    ctx.stroke();
    ctx.restore();
  }

  // Darker inner mass so the cards never look like paper cutouts.
  for (let i = 0; i < 26; i++) {
    const x = S * 0.5 + (random() - 0.5) * S * 0.4;
    const y = S * 0.55 + (random() - 0.5) * S * 0.35;
    const r = range(random, 6, 18);
    ctx.fillStyle = `rgba(36,52,35,${range(random, 0.16, 0.38)})`;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
  }

  // Sunlit edge.
  for (let i = 0; i < 24; i++) {
    const a = range(random, 0, TAU);
    const r = range(random, S * 0.2, S * 0.43);
    const x = S * 0.5 + Math.cos(a) * r;
    const y = S * 0.54 + Math.sin(a) * r * 0.84;
    const gg = ctx.createRadialGradient(x, y, 0, x, y, range(random, 5, 13));
    gg.addColorStop(0, 'rgba(201,183,118,0.28)');
    gg.addColorStop(1, 'rgba(201,183,118,0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(x, y, 13, 0, TAU);
    ctx.fill();
  }

  return toTexture(canvas, { wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping, aniso: 4 });
}

function createFernTexture() {
  const W = 256;
  const H = 512;
  const canvas = makeCanvas(W, H);
  const ctx = canvas.getContext('2d');
  const random = createRng(504);
  ctx.clearRect(0, 0, W, H);
  ctx.lineCap = 'round';

  const baseX = W * 0.5;
  const baseY = H - 10;
  const tipX = W * 0.52;
  const tipY = 18;

  ctx.strokeStyle = 'rgba(74,86,48,0.92)';
  ctx.lineWidth = 3.2;
  ctx.beginPath();
  ctx.moveTo(baseX, baseY);
  ctx.quadraticCurveTo(W * 0.46, H * 0.5, tipX, tipY);
  ctx.stroke();

  const pairs = 24;
  for (let i = 0; i < pairs; i++) {
    const t = 0.06 + (i / pairs) * 0.89;
    const y = lerp(baseY, tipY, t);
    const x = baseX + Math.sin(t * 3.2) * W * 0.065 + (0.5 - t) * W * 0.01;
    const taper = Math.sin(Math.pow(t, 0.68) * Math.PI) * 0.75 + 0.35;
    const len = (1 - t * 0.52) * W * 0.31 * taper;
    const droop = 0.4 + t * 0.4;
    for (const side of [-1, 1]) {
      const spread = len * side;
      const tipLx = x + spread;
      const tipLy = y - len * 0.24 - droop * 9;
      ctx.fillStyle = pick(random, ['rgba(53,78,46,0.9)', 'rgba(69,91,49,0.87)', 'rgba(84,101,55,0.82)', 'rgba(98,110,62,0.7)']);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + spread * 0.48, y - len * 0.2 - 8, tipLx, tipLy);
      ctx.quadraticCurveTo(x + spread * 0.46, y + len * 0.15, x, y + 2);
      ctx.closePath();
      ctx.fill();

      // Leaflet division.
      ctx.strokeStyle = 'rgba(29,51,32,0.35)';
      ctx.lineWidth = 0.8;
      for (let k = 1; k < 4; k++) {
        const tt = k / 4;
        ctx.beginPath();
        ctx.moveTo(x + spread * tt, y - len * 0.2 * tt);
        ctx.lineTo(x + spread * tt * 0.97, y + len * 0.1 * (1 - tt));
        ctx.stroke();
      }
    }
  }

  // Warm, sun-struck tips.
  for (let i = 0; i < 30; i++) {
    const t = range(random, 0.25, 0.95);
    const x = baseX + (random() - 0.5) * W * 0.42;
    const y = lerp(baseY, tipY, t);
    ctx.fillStyle = `rgba(169,158,95,${range(random, 0.16, 0.4)})`;
    ctx.beginPath();
    ctx.ellipse(x, y, range(random, 1, 3), range(random, 0.5, 1.5), random() * TAU, 0, TAU);
    ctx.fill();
  }

  return toTexture(canvas, { wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping, aniso: 4 });
}

function createGrassTexture() {
  const S = 256;
  const canvas = makeCanvas(S, S);
  const ctx = canvas.getContext('2d');
  const random = createRng(194);
  ctx.clearRect(0, 0, S, S);
  ctx.lineCap = 'round';

  for (let i = 0; i < 36; i++) {
    const rootX = S * 0.5 + (random() - 0.5) * S * 0.34;
    const rootY = S - range(random, 1, 9);
    const height = range(random, S * 0.45, S * 0.93);
    const tipX = rootX + (random() - 0.5) * S * 0.72;
    const tipY = rootY - height;
    const bendX = lerp(rootX, tipX, 0.55) + (random() - 0.5) * S * 0.18;
    const color = pick(random, [
      'rgba(83,100,57,0.94)',
      'rgba(105,115,65,0.9)',
      'rgba(125,126,76,0.84)',
      'rgba(147,135,87,0.7)',
      'rgba(63,83,51,0.9)',
    ]);
    ctx.strokeStyle = color;
    ctx.lineWidth = range(random, 1.2, 3.1);
    ctx.beginPath();
    ctx.moveTo(rootX, rootY);
    ctx.quadraticCurveTo(bendX, rootY - height * 0.48, tipX, tipY);
    ctx.stroke();
  }

  for (let i = 0; i < 7; i++) {
    const x = S * 0.5 + (random() - 0.5) * S * 0.5;
    const y = range(random, S * 0.1, S * 0.5);
    ctx.fillStyle = 'rgba(138,124,84,0.6)';
    ctx.beginPath();
    ctx.ellipse(x, y, 2, 6, range(random, -0.4, 0.4), 0, TAU);
    ctx.fill();
  }

  return toTexture(canvas, { wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping, aniso: 4 });
}

function createLeafLitterTexture() {
  const S = 64;
  const canvas = makeCanvas(S, S);
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, S, S);
  ctx.translate(S / 2, S / 2);
  ctx.fillStyle = '#d7c29e';
  ctx.beginPath();
  ctx.moveTo(0, -S * 0.38);
  ctx.bezierCurveTo(S * 0.32, -S * 0.27, S * 0.31, S * 0.22, 0, S * 0.4);
  ctx.bezierCurveTo(-S * 0.31, S * 0.22, -S * 0.32, -S * 0.27, 0, -S * 0.38);
  ctx.fill();
  ctx.strokeStyle = 'rgba(93,66,42,0.48)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(0, -S * 0.32);
  ctx.lineTo(0, S * 0.55);
  for (let i = -3; i <= 3; i++) {
    ctx.moveTo(0, i * 7);
    ctx.lineTo(i * 7, i * 7 - 9);
    ctx.moveTo(0, i * 7);
    ctx.lineTo(i * 7, i * 7 + 9);
  }
  ctx.stroke();
  return toTexture(canvas, { wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping, aniso: 2 });
}

function createFlowerTexture() {
  const S = 256;
  const canvas = makeCanvas(S, S);
  const ctx = canvas.getContext('2d');
  const random = createRng(71);
  ctx.clearRect(0, 0, S, S);
  ctx.lineCap = 'round';

  for (let f = 0; f < 5; f++) {
    const baseX = S * 0.5 + (random() - 0.5) * S * 0.34;
    const tipX = S * 0.5 + (random() - 0.5) * S * 0.62;
    const tipY = range(random, S * 0.25, S * 0.56);
    ctx.strokeStyle = 'rgba(74,92,51,0.9)';
    ctx.lineWidth = range(random, 1.2, 2.3);
    ctx.beginPath();
    ctx.moveTo(baseX, S - 3);
    ctx.quadraticCurveTo(lerp(baseX, tipX, 0.5), S * 0.65, tipX, tipY);
    ctx.stroke();
    for (let l = 0; l < 3; l++) {
      const ly = range(random, S * 0.55, S * 0.88);
      ctx.fillStyle = 'rgba(67,91,51,0.8)';
      ctx.beginPath();
      ctx.ellipse(baseX + (random() - 0.5) * 20, ly, range(random, 3, 7), range(random, 1, 2.7), random() * TAU, 0, TAU);
      ctx.fill();
    }
    const petals = 6;
    const petalColor = pick(random, ['#e0c68d', '#d8a67f', '#e8d9b8', '#c7936e']);
    for (let p = 0; p < petals; p++) {
      const a = (p / petals) * TAU;
      ctx.fillStyle = petalColor;
      ctx.globalAlpha = 0.92;
      ctx.beginPath();
      ctx.ellipse(tipX + Math.cos(a) * 5.5, tipY + Math.sin(a) * 5, 5.5, 2.8, a, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#a0783d';
    ctx.beginPath();
    ctx.arc(tipX, tipY, 2.6, 0, TAU);
    ctx.fill();
  }

  return toTexture(canvas, { wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping, aniso: 4 });
}

function createGlowTexture() {
  const S = 128;
  const canvas = makeCanvas(S, S);
  const ctx = canvas.getContext('2d');
  const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0, 'rgba(255,255,255,0.95)');
  g.addColorStop(0.18, 'rgba(255,255,255,0.5)');
  g.addColorStop(0.45, 'rgba(255,255,255,0.14)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  return toTexture(canvas, { wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping, aniso: 2 });
}

function createSmokeTexture() {
  const S = 128;
  const canvas = makeCanvas(S, S);
  const ctx = canvas.getContext('2d');
  const random = createRng(312);
  ctx.clearRect(0, 0, S, S);
  for (let i = 0; i < 22; i++) {
    const x = S * 0.5 + (random() - 0.5) * S * 0.42;
    const y = S * 0.5 + (random() - 0.5) * S * 0.42;
    const r = range(random, 8, 31);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const a = range(random, 0.08, 0.2);
    g.addColorStop(0, `rgba(255,255,255,${a})`);
    g.addColorStop(0.6, `rgba(255,255,255,${a * 0.45})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
  }
  return toTexture(canvas, { wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping, aniso: 2 });
}

function createMistTexture() {
  const W = 256;
  const H = 128;
  const canvas = makeCanvas(W, H);
  const ctx = canvas.getContext('2d');
  const random = createRng(129);
  ctx.clearRect(0, 0, W, H);
  for (let i = 0; i < 26; i++) {
    const x = range(random, W * 0.16, W * 0.84);
    const y = range(random, H * 0.28, H * 0.72);
    const r = range(random, H * 0.18, H * 0.58);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(255,255,255,${range(random, 0.025, 0.08)})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(x, y, r * 1.5, r * 0.55, 0, 0, TAU);
    ctx.fill();
  }
  return toTexture(canvas, { wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping, aniso: 2 });
}

function createMossTexture() {
  const S = 256;
  const canvas = makeCanvas(S, S);
  const ctx = canvas.getContext('2d');
  const random = createRng(555);
  ctx.clearRect(0, 0, S, S);
  for (let i = 0; i < 360; i++) {
    const x = S * 0.5 + (random() - 0.5) * S * 0.78;
    const y = S * 0.5 + (random() - 0.5) * S * 0.62;
    const d = Math.hypot((x - S * 0.5) / (S * 0.45), (y - S * 0.5) / (S * 0.35));
    if (d > 1) continue;
    ctx.fillStyle = pick(random, ['rgba(79,96,55,0.6)', 'rgba(104,119,67,0.55)', 'rgba(58,80,49,0.5)', 'rgba(127,135,80,0.4)']);
    ctx.beginPath();
    ctx.arc(x, y, range(random, 0.7, 2.7), 0, TAU);
    ctx.fill();
  }
  return toTexture(canvas, { wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping, aniso: 2 });
}

// Key light: low, warm, from the front-left so the logs and porch read.
const SUN_DIRECTION = new THREE.Vector3(-0.58, 0.30, 0.57).normalize();
// A separate, cooler rim from behind the clearing keeps the forest layered.
const RIM_DIRECTION = new THREE.Vector3(0.38, 0.32, -0.86).normalize();

function buildSky() {
  const skyMaterial = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    uniforms: {
      uTop: { value: new THREE.Color(CONFIG.colors.skyTop) },
      uHorizon: { value: new THREE.Color(CONFIG.colors.skyHorizon) },
      uHaze: { value: new THREE.Color(CONFIG.colors.skyHaze) },
      uSunColor: { value: new THREE.Color(0xffd9ae) },
      uSunDir: { value: SUN_DIRECTION.clone() },
      uTime: windTime,
    },
    vertexShader: /* glsl */ `
      varying vec3 vDir;
      void main() {
        vDir = normalize(position);
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: /* glsl */ `
      varying vec3 vDir;
      uniform vec3 uTop;
      uniform vec3 uHorizon;
      uniform vec3 uHaze;
      uniform vec3 uSunColor;
      uniform vec3 uSunDir;

      float hash12(vec2 p) {
        vec3 p3 = fract(vec3(p.xyx) * 0.1031);
        p3 += dot(p3, p3.yzx + 33.33);
        return fract((p3.x + p3.y) * p3.z);
      }

      void main() {
        vec3 dir = normalize(vDir);
        float up = smoothstep(-0.06, 0.72, dir.y);
        vec3 color = mix(uHorizon, uTop, pow(up, 0.82));
        color = mix(color, uHaze, smoothstep(0.22, -0.04, dir.y) * 0.64);
        float sd = max(dot(dir, normalize(uSunDir)), 0.0);
        color += uSunColor * (pow(sd, 22.0) * 0.55 + pow(sd, 5.0) * 0.10);
        float horizonLine = smoothstep(0.09, 0.0, abs(dir.y + 0.01));
        color = mix(color, uHaze, horizonLine * 0.18);
        float dither = hash12(gl_FragCoord.xy) - 0.5;
        color += dither * 0.0035;
        gl_FragColor = vec4(color, 1.0);
      }
    `,
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(150, 32, 20), skyMaterial);
  sky.frustumCulled = false;
  sky.renderOrder = -10;
  scene.add(sky);

  // Layered sun glows. They are deliberately soft and partially eaten by the pines.

  halo.position.set(-10, 9.0, -33);

  const canopyLightMat = new THREE.SpriteMaterial({

/* ==========================================================================
