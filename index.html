   ========================================================================== */

const PATH_POINTS = [
  new THREE.Vector3(-2.05, 0, 13.8),
  new THREE.Vector3(-1.95, 0, 11.2),
  new THREE.Vector3(-1.66, 0, 8.7),
  new THREE.Vector3(-1.18, 0, 6.35),
  new THREE.Vector3(-0.45, 0, 4.25),
  new THREE.Vector3(0.48, 0, 2.45),
  new THREE.Vector3(1.53, 0, 0.95),
  new THREE.Vector3(2.52, 0, -0.02),
  new THREE.Vector3(2.92, 0, -0.42),
];
const pathCurve = new THREE.CatmullRomCurve3(PATH_POINTS, false, 'centripetal', 0.5);
const PATH_SAMPLES = [];
let PATH_LENGTH = 0;
{
  const divisions = 120;
  for (let i = 0; i <= divisions; i++) {
    PATH_SAMPLES.push(pathCurve.getPointAt(i / divisions));
    if (i > 0) PATH_LENGTH += PATH_SAMPLES[i].distanceTo(PATH_SAMPLES[i - 1]);
  }
}

function distanceToPath(x, z) {
  let min = Infinity;
  for (let i = 0; i < PATH_SAMPLES.length; i += 2) {
    const p = PATH_SAMPLES[i];
    const dx = x - p.x;
    const dz = z - p.z;
    const d = dx * dx + dz * dz;
    if (d < min) min = d;
  }
  return Math.sqrt(min);
}

const CLEARING = { x: 4.0, z: -5.2, inner: 7.4, outer: 13.5 };
const GARDEN_CENTER = { x: -4.05, z: 2.95 };

function terrainHeight(x, z) {
  const dc = Math.hypot(x - CLEARING.x, z - CLEARING.z);
  const clearing = smoothstep(CLEARING.inner, CLEARING.outer, dc);
  const pathDistance = distanceToPath(x, z);
  const pathClear = smoothstep(1.05, 3.2, pathDistance);
  const gardenD = Math.hypot(x - GARDEN_CENTER.x, z - GARDEN_CENTER.z);
  const gardenClear = smoothstep(2.3, 4.8, gardenD);
  const mask = clearing * pathClear * gardenClear;
  const broad = (fbm(x * 0.037 + 11.2, z * 0.037 - 3.1, 3, 101) - 0.5) * 1.55;
  const ridge = (fbm(x * 0.092 - 2.2, z * 0.092 + 6.8, 3, 47) - 0.5) * 0.52;
  const fine = (fbm(x * 0.26, z * 0.26, 2, 8) - 0.5) * 0.07;
  return (broad + ridge + fine) * mask;
}

function buildTerrain() {
  const size = 185;
  const segments = 140;
  const geometry = new THREE.PlaneGeometry(size, size, segments, segments);
  geometry.rotateX(-Math.PI / 2);
  const position = geometry.attributes.position;
  const colors = new Float32Array(position.count * 3);
  const c1 = new THREE.Color(0x6f7150);
  const c2 = new THREE.Color(0x5b513b);
  const c3 = new THREE.Color(0x4a4b38);
  const c4 = new THREE.Color(0x7c6d50);
  const tmp = new THREE.Color();

  for (let i = 0; i < position.count; i++) {
    const x = position.getX(i);
    const z = position.getZ(i);
    position.setY(i, terrainHeight(x, z));

    const moss = fbm(x * 0.055, z * 0.055, 3, 29);
    const dry = fbm(x * 0.12 + 3, z * 0.12 - 1, 2, 81);
    tmp.copy(c1).lerp(c2, smoothstep(0.35, 0.75, dry));
    tmp.lerp(c3, smoothstep(0.46, 0.7, moss) * 0.52);
    tmp.lerp(c4, smoothstep(0.64, 0.86, fbm(x * 0.18, z * 0.18, 2, 109)) * 0.2);
    colors[i * 3] = tmp.r;
    colors[i * 3 + 1] = tmp.g;
    colors[i * 3 + 2] = tmp.b;
  }
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geometry.computeVertexNormals();

  const material = new THREE.MeshStandardMaterial({
    map: TEX.ground,
    bumpMap: TEX.groundBump,
    bumpScale: 0.13,
    vertexColors: true,
    roughness: 1,
    metalness: 0,
    color: 0xffffff,
  });
  const ground = new THREE.Mesh(geometry, material);
  ground.receiveShadow = true;
  ground.castShadow = false;
  scene.add(ground);

  return ground;
}

function buildPath() {
  const segments = 130;
  const columns = 5;
  const positions = [];
  const uvs = [];
  const indices = [];
  const random = createRng(481);

  let distanceAlong = 0;
  let prev = pathCurve.getPointAt(0);
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const point = pathCurve.getPointAt(t);
    if (i > 0) distanceAlong += point.distanceTo(prev);
    prev = point;
    const tangent = pathCurve.getTangentAt(Math.min(1, Math.max(0, t))).normalize();
    const nx = -tangent.z;
    const nz = tangent.x;
    const width = (1.38 + Math.sin(t * 6.4 + 0.6) * 0.13 + (fbm(t * 4.2 + 8.3, 0.4, 2, 11) - 0.5) * 0.32) * (1.0 + t * 0.18);
    const edgeWobble = (fbm(t * 5.8 + 2.2, 1.1, 2, 19) - 0.5) * 0.2;
    const y = terrainHeight(point.x, point.z);

    for (let col = 0; col < columns; col++) {
      const u = col / (columns - 1);
      const side = (u - 0.5) * 2;
      const offset = side * width * 0.5 + side * edgeWobble * Math.abs(side);
      const x = point.x + nx * offset;
      const z = point.z + nz * offset;
      const crown = (1 - Math.abs(side)) * 0.028;
      positions.push(x, y + 0.035 + crown + (fbm(t * 9 + col, 1.7, 2, 33) - 0.5) * 0.012, z);
      uvs.push(u, distanceAlong / 3.05);
    }
  }

  for (let i = 0; i < segments; i++) {
    for (let col = 0; col < columns - 1; col++) {
      const a = i * columns + col;
      const b = a + 1;
      const c = a + columns;
      const d = c + 1;
      indices.push(a, b, c, b, d, c);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();

  const material = new THREE.MeshStandardMaterial({
    map: TEX.path,
    roughness: 1,
    metalness: 0,
    transparent: true,
    alphaTest: 0.04,
    depthWrite: true,
    polygonOffset: true,
    polygonOffsetFactor: -2,
    polygonOffsetUnits: -4,
    color: 0xe7c8a3,
  });
  const path = new THREE.Mesh(geometry, material);
  path.receiveShadow = true;
  path.castShadow = false;
  scene.add(path);
  return path;
}

/* ==========================================================================
   05 路 THE CABIN
   ========================================================================== */

const UNIT_BOX = new THREE.BoxGeometry(1, 1, 1);
const CABIN = CONFIG.cabin;
const cabinGroup = new THREE.Group();
cabinGroup.position.copy(CABIN.center);
scene.add(cabinGroup);

const cabinAnchors = {};

function addBox(parent, material, {
  x = 0, y = 0, z = 0, w = 1, h = 1, d = 1, rx = 0, ry = 0, rz = 0,
  cast = true, receive = true, name = '',
} = {}) {
  const mesh = new THREE.Mesh(UNIT_BOX, material);
  mesh.position.set(x, y, z);
  mesh.rotation.set(rx, ry, rz);
  mesh.scale.set(w, h, d);
  mesh.castShadow = cast;
  mesh.receiveShadow = receive;
  if (name) mesh.name = name;
  parent.add(mesh);
  return mesh;
}

function addCylinder(parent, material, radiusTop, radiusBottom, height, segments, {
  x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, cast = true, receive = true,
} = {}) {
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments, 1),
    material
  );
  mesh.position.set(x, y, z);
  mesh.rotation.set(rx, ry, rz);
  mesh.castShadow = cast;
  mesh.receiveShadow = receive;
  parent.add(mesh);
  return mesh;
}

function cutInterval(intervals, start, end) {
  const result = [];
  for (const [a, b] of intervals) {
    if (end <= a || start >= b) {
      result.push([a, b]);
    } else {
      if (start > a + 0.05) result.push([a, start]);
      if (end < b - 0.05) result.push([end, b]);
    }
  }
  return result;
}

function makeLogColors(seed) {
  const random = createRng(seed);
  const list = ['#f2e2cc', '#e5d1b6', '#d8c2a4', '#ebd8bf', '#cdb697', '#f5e7d4'];
  return () => new THREE.Color(pick(random, list));
}

function buildCabin() {
  const W = CABIN.width;
  const D = CABIN.depth;
  const F = CABIN.foundation;
  const R = CABIN.logRadius;
  const rowYs = [];
  for (let i = 0; i < CABIN.rows; i++) rowYs.push(F + R + i * CABIN.rowGap);
  const wallTop = rowYs[rowYs.length - 1] + R;
  const eaveY = wallTop + 0.18;
  const ridgeY = eaveY + 1.98;
  const ridgeZ = 0.18;
  const eaveFrontZ = 3.42;
  const eaveBackZ = -3.0;
  const doorTop = F + CABIN.doorH;
  const doorLeft = CABIN.doorX - CABIN.doorW / 2;
  const doorRight = CABIN.doorX + CABIN.doorW / 2;
  const fw = CABIN.frontWindowW;
  const fh = CABIN.frontWindowH;
  const fwy = CABIN.frontWindowY;
  const fwx = CABIN.frontWindowX;
  const winLeft = fwx - fw / 2;
  const winRight = fwx + fw / 2;
  const winBottom = fwy - fh / 2;
  const winTop = fwy + fh / 2;
  const sideWinLeft = CABIN.sideWindowZ - CABIN.sideWindowW / 2;
  const sideWinRight = CABIN.sideWindowZ + CABIN.sideWindowW / 2;
  const sideWinBottom = CABIN.sideWindowY - CABIN.sideWindowH / 2;
  const sideWinTop = CABIN.sideWindowY + CABIN.sideWindowH / 2;

  cabinAnchors.wallTop = wallTop;
  cabinAnchors.ridgeY = ridgeY;
  cabinAnchors.frontWindow = new THREE.Vector3(fwx, fwy, 2.76);

  /* --- stone foundation --- */
  const foundation = new THREE.Mesh(UNIT_BOX, MATS.stone);
  foundation.position.set(0, F * 0.5 - 0.16, 0);
  foundation.scale.set(W + 0.28, F + 0.34, D + 0.25);
  foundation.castShadow = true;
  foundation.receiveShadow = true;
  cabinGroup.add(foundation);

  const stoneChunks = [];
  const stoneRandom = createRng(7201);
  const stoneGeo = new THREE.DodecahedronGeometry(1, 0);
  for (let i = 0; i < 26; i++) {
    const frontSide = i < 17;
    const x = frontSide ? range(stoneRandom, -3.45, 3.45) : (i % 2 ? 1 : -1) * (W * 0.5 + 0.1);
    const z = frontSide ? D * 0.5 + 0.1 : range(stoneRandom, -2.5, 2.5);
    stoneChunks.push({
      p: new THREE.Vector3(x, range(stoneRandom, 0.06, 0.46), z),
      q: randomQuat(stoneRandom),
      s: new THREE.Vector3(range(stoneRandom, 0.15, 0.35), range(stoneRandom, 0.09, 0.19), range(stoneRandom, 0.12, 0.25)),
      c: new THREE.Color(pick(stoneRandom, ['#dad5c7', '#b5b0a2', '#9fa195', '#c7c1b2'])),
    });
  }
  const stoneChunkMesh = makeInstanced(stoneGeo, MATS.stone, stoneChunks, { castShadow: true, receiveShadow: true });
  cabinGroup.add(stoneChunkMesh);

  // Soft moss at the foot of the foundation.
  const mossMat = new THREE.MeshStandardMaterial({ color: 0x5f7146, roughness: 1, metalness: 0 });
  const mossGeo = new THREE.IcosahedronGeometry(1, 1);
  const mossItems = [];
  for (let i = 0; i < 20; i++) {
    mossItems.push({
      p: new THREE.Vector3(range(stoneRandom, -3.3, 3.3), range(stoneRandom, 0.03, 0.14), range(stoneRandom, D * 0.5 - 0.05, D * 0.5 + 0.22)),
      q: randomQuat(stoneRandom),
      s: new THREE.Vector3(range(stoneRandom, 0.12, 0.3), range(stoneRandom, 0.015, 0.05), range(stoneRandom, 0.08, 0.2)),
      c: new THREE.Color(pick(stoneRandom, ['#7f8f56', '#63784a', '#8a955c'])),
    });
  }
  cabinGroup.add(makeInstanced(mossGeo, mossMat, mossItems, { receiveShadow: true }));

  /* --- porch deck --- */
  const deckItems = [];
  const deckRandom = createRng(1602);
  const deckTop = F;
  for (let i = 0; i < 11; i++) {
    deckItems.push({
      p: new THREE.Vector3(0, deckTop - 0.035, 2.66 + i * 0.186),
      q: new THREE.Quaternion(),
      s: new THREE.Vector3(5.8, 0.075, 0.174),
      c: new THREE.Color(pick(deckRandom, ['#e0c6a4', '#d3b993', '#ecd4b4', '#c9ae88'])),
    });
  }
  const deckMesh = makeInstanced(UNIT_BOX, MATS.plankH, deckItems, { castShadow: true, receiveShadow: true });
  cabinGroup.add(deckMesh);
  addBox(cabinGroup, MATS.wood, { x: 0, y: deckTop - 0.1, z: 3.62, w: 5.9, h: 0.16, d: 0.08, receive: false });
  addBox(cabinGroup, MATS.wood, { x: -2.86, y: deckTop - 0.11, z: 3.6, w: 0.1, h: 0.2, d: 1.93 });
  addBox(cabinGroup, MATS.wood, { x: 2.86, y: deckTop - 0.11, z: 3.6, w: 0.1, h: 0.2, d: 1.93 });

  /* --- steps --- */
  const stepMat = new THREE.MeshStandardMaterial({
    map: TEX.plankH,
    color: 0x9a7755,
    roughness: 0.97,
    metalness: 0,
  });
  const stepStoneMat = new THREE.MeshStandardMaterial({
    map: TEX.stone,
    color: 0x8e8b80,
    roughness: 1,
    metalness: 0,
    bumpMap: TEX.stone,
    bumpScale: 0.04,
  });
  for (let i = 0; i < 2; i++) {
    const stepY = F - 0.18 - i * 0.2;
    const stepZ = 4.7 + i * 0.34;
    addBox(cabinGroup, stepMat, {
      x: CABIN.doorX, y: stepY, z: stepZ,
      w: 1.55 - i * 0.08, h: 0.12, d: 0.4, cast: true, receive: true,
    });
    addBox(cabinGroup, stepStoneMat, {
      x: CABIN.doorX - 0.66, y: stepY - 0.11, z: stepZ,
      w: 0.28, h: 0.22, d: 0.4, cast: true, receive: true,
    });
    addBox(cabinGroup, stepStoneMat, {
      x: CABIN.doorX + 0.66, y: stepY - 0.11, z: stepZ,
      w: 0.28, h: 0.22, d: 0.4, cast: true, receive: true,
    });
  }

  /* --- log walls --- */
  const logGeometry = new THREE.CylinderGeometry(1, 1, 1, 9, 1, false);
  logGeometry.rotateZ(Math.PI / 2);
  const logItems = [];
  const capItems = [];
  const logColor = makeLogColors(3502);
  const halfW = W / 2;
  const halfD = D / 2;
  const cornerOverhang = 0.16;

  const addXLog = (cx, y, z, length, capEnds = false) => {
    logItems.push({
      p: new THREE.Vector3(cx, y, z),
      q: new THREE.Quaternion(),
      s: new THREE.Vector3(length, R, R),
      c: logColor(),
    });
    if (capEnds) {
      const capQ1 = quatFromEuler(0, Math.PI / 2, 0);
      const capQ2 = quatFromEuler(0, -Math.PI / 2, 0);
      capItems.push({
        p: new THREE.Vector3(cx + length / 2 + 0.012, y, z),
        q: capQ1,
        s: new THREE.Vector3(R, R, 1),
        c: new THREE.Color(pick(stoneRandom, ['#d8c09d', '#c7aa82', '#e4cfad'])),
      });
      capItems.push({
        p: new THREE.Vector3(cx - length / 2 - 0.012, y, z),
        q: capQ2,
        s: new THREE.Vector3(R, R, 1),
        c: new THREE.Color(pick(stoneRandom, ['#cbb28e', '#e2caa8', '#baa17f'])),
      });
    }
  };

  const addZLog = (x, y, cz, length, capEnds = false) => {
    logItems.push({
      p: new THREE.Vector3(x, y, cz),
      q: quatFromEuler(0, Math.PI / 2, 0),
      s: new THREE.Vector3(length, R, R),
      c: logColor(),
    });
    if (capEnds) {
      capItems.push({
        p: new THREE.Vector3(x, y, cz + length / 2 + 0.012),
        q: new THREE.Quaternion(),
        s: new THREE.Vector3(R, R, 1),
        c: new THREE.Color(pick(stoneRandom, ['#d8c09d', '#c7aa82', '#e4cfad'])),
      });
      capItems.push({
        p: new THREE.Vector3(x, y, cz - length / 2 - 0.012),
        q: quatFromEuler(0, Math.PI, 0),
        s: new THREE.Vector3(R, R, 1),
        c: new THREE.Color(pick(stoneRandom, ['#cbb28e', '#e2caa8', '#baa17f'])),
      });
    }
  };

  // Front wall (facing +z) is split around the door and window.
  for (const y of rowYs) {
    let intervals = [[-halfW - cornerOverhang, halfW + cornerOverhang]];
    if (y - R < doorTop) intervals = cutInterval(intervals, doorLeft, doorRight);
    if (y + R > winBottom && y - R < winTop) intervals = cutInterval(intervals, winLeft, winRight);
    for (const [a, b] of intervals) {
      if (b - a < 0.07) continue;
      addXLog((a + b) / 2, y, halfD, b - a, true);
    }
  }

  // Back wall.
  for (const y of rowYs) addXLog(0, y, -halfD, W + cornerOverhang * 2, true);

  // Side walls, with a smaller warm window on the visible left wall.
  for (const y of rowYs) {
    let leftIntervals = [[-halfD - cornerOverhang, halfD + cornerOverhang]];
    if (y + R > sideWinBottom && y - R < sideWinTop) {
      leftIntervals = cutInterval(leftIntervals, sideWinLeft, sideWinRight);
    }
    for (const [a, b] of leftIntervals) {
      if (b - a < 0.07) continue;
      addZLog(-halfW, y, (a + b) / 2, b - a, true);
    }
    addZLog(halfW, y, 0, D + cornerOverhang * 2, true);
  }

  // Pale chinking behind the logs keeps small gaps from going black.
  const chinking = new THREE.MeshStandardMaterial({ color: 0x9b886c, roughness: 1, metalness: 0 });
  addBox(cabinGroup, chinking, { x: 0, y: wallTop * 0.5 + F * 0.5 - 0.01, z: halfD - 0.055, w: W + 0.01, h: wallTop - F, d: 0.08, cast: false, receive: true });
  addBox(cabinGroup, chinking, { x: 0, y: wallTop * 0.5 + F * 0.5 - 0.01, z: -halfD + 0.055, w: W + 0.01, h: wallTop - F, d: 0.08, cast: false, receive: true });
  addBox(cabinGroup, chinking, { x: -halfW + 0.055, y: wallTop * 0.5 + F * 0.5 - 0.01, z: 0, w: 0.08, h: wallTop - F, d: D + 0.01, cast: false, receive: true });
  addBox(cabinGroup, chinking, { x: halfW - 0.055, y: wallTop * 0.5 + F * 0.5 - 0.01, z: 0, w: 0.08, h: wallTop - F, d: D + 0.01, cast: false, receive: true });

  cabinGroup.add(makeInstanced(logGeometry, MATS.wood, logItems, { castShadow: true, receiveShadow: true }));
  const capGeometry = new THREE.CircleGeometry(1, 12);
  cabinGroup.add(makeInstanced(capGeometry, MATS.cutWood, capItems, { castShadow: true, receiveShadow: true }));

  /* --- wall top plates and corner trim --- */
  addBox(cabinGroup, MATS.wood, { x: 0, y: wallTop + 0.06, z: halfD + 0.02, w: W + 0.42, h: 0.17, d: 0.34 });
  addBox(cabinGroup, MATS.wood, { x: 0, y: wallTop + 0.06, z: -halfD - 0.02, w: W + 0.42, h: 0.17, d: 0.34 });
  addBox(cabinGroup, MATS.wood, { x: -halfW - 0.02, y: wallTop + 0.06, z: 0, w: 0.34, h: 0.17, d: D + 0.3 });
  addBox(cabinGroup, MATS.wood, { x: halfW + 0.02, y: wallTop + 0.06, z: 0, w: 0.34, h: 0.17, d: D + 0.3 });

  /* --- warm window material --- */
  const windowMaterial = new THREE.MeshStandardMaterial({
    color: 0x0a0705,
    emissive: new THREE.Color(0xffc489),
    emissiveMap: TEX.window,
    emissiveIntensity: 0.76,
    roughness: 0.7,
    metalness: 0,
  });
  const sideWindowMaterial = windowMaterial.clone();
  sideWindowMaterial.emissiveIntensity = 0.66;
  const roundWindowMaterial = windowMaterial.clone();
  roundWindowMaterial.emissiveIntensity = 0.46;

  function makeWindowFrame(width, height, depth = 0.12) {
    const group = new THREE.Group();
    const frameMat = MATS.wood;
    const border = 0.095;
    addBox(group, frameMat, { x: -width / 2, y: 0, z: 0.02, w: border, h: height + border * 2, d: depth });
    addBox(group, frameMat, { x: width / 2, y: 0, z: 0.02, w: border, h: height + border * 2, d: depth });
    addBox(group, frameMat, { x: 0, y: height / 2, z: 0.02, w: width + border * 2, h: border, d: depth });
    addBox(group, frameMat, { x: 0, y: -height / 2, z: 0.02, w: width + border * 2, h: border, d: depth });
    addBox(group, frameMat, { x: 0, y: 0, z: 0.07, w: 0.055, h: height, d: 0.06, cast: false });
    addBox(group, frameMat, { x: 0, y: 0, z: 0.07, w: width, h: 0.055, d: 0.06, cast: false });
    addBox(group, MATS.wood, { x: 0, y: -height / 2 - border, z: 0.11, w: width + 0.27, h: 0.075, d: 0.24, rx: 0.08 });
    return group;
  }

  // Front window.
  const frontWindowPanel = new THREE.Mesh(new THREE.PlaneGeometry(fw, fh), windowMaterial);
  frontWindowPanel.position.set(fwx, fwy, halfD + R + 0.03);
  cabinGroup.add(frontWindowPanel);
  const frontFrame = makeWindowFrame(fw, fh);
  frontFrame.position.set(fwx, fwy, halfD + R + 0.045);
  cabinGroup.add(frontFrame);

  const frontWindowPoint = new THREE.PointLight(0xffaa62, 1.95, 4.6, 2);
  frontWindowPoint.position.set(fwx, fwy - 0.1, halfD + 0.72);
  cabinGroup.add(frontWindowPoint);
  windowLights.push(frontWindowPoint);

  // Window flower box.
  addBox(cabinGroup, MATS.wood, { x: fwx, y: fwy - fh / 2 - 0.25, z: halfD + 0.23, w: fw + 0.3, h: 0.23, d: 0.3, cast: true });
  const windowSoil = new THREE.MeshStandardMaterial({ color: 0x3e3023, roughness: 1 });
  addBox(cabinGroup, windowSoil, { x: fwx, y: fwy - fh / 2 - 0.12, z: halfD + 0.23, w: fw + 0.15, h: 0.06, d: 0.2, cast: false });
  cabinAnchors.windowBox = new THREE.Vector3(fwx, fwy - fh / 2 - 0.12, halfD + 0.23);

  // Left side window.
  const sidePanel = new THREE.Mesh(new THREE.PlaneGeometry(CABIN.sideWindowW, CABIN.sideWindowH), sideWindowMaterial);
  sidePanel.position.set(-halfW - R - 0.03, CABIN.sideWindowY, CABIN.sideWindowZ);
  sidePanel.rotation.y = -Math.PI / 2;
  cabinGroup.add(sidePanel);
  const sideFrame = makeWindowFrame(CABIN.sideWindowW, CABIN.sideWindowH, 0.1);
  sideFrame.position.set(-halfW - R - 0.05, CABIN.sideWindowY, CABIN.sideWindowZ);
  sideFrame.rotation.y = -Math.PI / 2;
  cabinGroup.add(sideFrame);

  const sideWindowPoint = new THREE.PointLight(0xffa562, 1.25, 4.0, 2);
  sideWindowPoint.position.set(-halfW - 0.6, CABIN.sideWindowY, CABIN.sideWindowZ);
  cabinGroup.add(sideWindowPoint);
  windowLights.push(sideWindowPoint);

  /* --- door and its warm interior --- */
  const doorWoodMaterial = new THREE.MeshStandardMaterial({
    map: TEX.plankV,
    color: 0x715139,
    roughness: 0.9,
    metalness: 0,
    bumpMap: TEX.plankV,
    bumpScale: 0.024,
  });
  const doorInteriorMaterial = new THREE.MeshBasicMaterial({
    map: TEX.window,
    color: 0x3e2516,
    transparent: false,
    toneMapped: true,
  });
  const doorInterior = new THREE.Mesh(new THREE.PlaneGeometry(0.94, 2.04), doorInteriorMaterial);
  doorInterior.position.set(CABIN.doorX, F + CABIN.doorH / 2, halfD - 0.015);
  cabinGroup.add(doorInterior);

  const doorJamb = new THREE.Group();
  addBox(doorJamb, MATS.wood, { x: doorLeft - 0.06, y: F + CABIN.doorH / 2, z: halfD + 0.09, w: 0.13, h: CABIN.doorH + 0.2, d: 0.22 });
  addBox(doorJamb, MATS.wood, { x: doorRight + 0.06, y: F + CABIN.doorH / 2, z: halfD + 0.09, w: 0.13, h: CABIN.doorH + 0.2, d: 0.22 });
  addBox(doorJamb, MATS.wood, { x: CABIN.doorX, y: doorTop + 0.08, z: halfD + 0.09, w: CABIN.doorW + 0.32, h: 0.15, d: 0.24 });
  addBox(doorJamb, MATS.stone, { x: CABIN.doorX, y: F + 0.02, z: halfD + 0.2, w: CABIN.doorW + 0.36, h: 0.11, d: 0.38 });
  cabinGroup.add(doorJamb);

  const doorPivot = new THREE.Group();
  doorPivot.position.set(doorLeft + 0.025, F, halfD + 0.16);
  doorPivot.rotation.y = 0.11;
  cabinGroup.add(doorPivot);
  const doorLeaf = addBox(doorPivot, doorWoodMaterial, {
    x: CABIN.doorW / 2, y: CABIN.doorH / 2, z: 0,
    w: CABIN.doorW - 0.04, h: CABIN.doorH - 0.04, d: 0.075, cast: true, receive: true,
  });
  doorLeaf.name = 'door';
  // Horizontal strengthening battens.
  addBox(doorPivot, MATS.wood, { x: CABIN.doorW / 2, y: CABIN.doorH * 0.26, z: 0.052, w: CABIN.doorW - 0.13, h: 0.09, d: 0.035 });
  addBox(doorPivot, MATS.wood, { x: CABIN.doorW / 2, y: CABIN.doorH * 0.8, z: 0.052, w: CABIN.doorW - 0.13, h: 0.09, d: 0.035 });
  // Iron hinges and handle.

  addBox(cabinGroup, MATS.darkInterior, { x: chimneyX, y: 6.73, z: chimneyZ, w: 0.46, h: 0.035, d: 0.4, cast: false });
  addCylinder(cabinGroup, MATS.iron, 0.21, 0.24, 0.24, 8, { x: chimneyX, y: 6.82, z: chimneyZ, cast: true });
  const chimneyCap = new THREE.Mesh(new THREE.ConeGeometry(0.37, 0.2, 6), MATS.iron);
  chimneyCap.position.set(chimneyX, 6.97, chimneyZ);
  chimneyCap.castShadow = true;
  cabinGroup.add(chimneyCap);
  addBox(cabinGroup, MATS.wood, { x: chimneyX, y: 3.75, z: chimneyZ + 0.46, w: 1.04, h: 0.12, d: 0.2 });
  cabinAnchors.chimney = new THREE.Vector3(chimneyX, 6.88, chimneyZ);

  // Rough stone masonry, built as chunky stones rather than a tiled box.
  const chimneyRandom = createRng(881);
  const chimneyStones = [];
  const chimneyFaces = [
    { nx: 0, nz: 1, ux: 1, uz: 0, half: 0.45 },
    { nx: 1, nz: 0, ux: 0, uz: 1, half: 0.41 },
    { nx: -1, nz: 0, ux: 0, uz: 1, half: 0.41 },
  ];
  for (const face of chimneyFaces) {
    const rows = 11;
    for (let row = 0; row < rows; row++) {
      const y = 4.45 + row * 0.195 + range(chimneyRandom, -0.014, 0.014);
      const cols = 4;
      for (let col = 0; col < cols; col++) {
        const across = (col - (cols - 1) / 2) * 0.225 + range(chimneyRandom, -0.035, 0.035);
        const px = chimneyX + face.ux * across + face.nx * (0.43 + range(chimneyRandom, -0.01, 0.025));
        const pz = chimneyZ + face.uz * across + face.nz * (0.43 + range(chimneyRandom, -0.01, 0.025));
        chimneyStones.push({
          p: new THREE.Vector3(px, y, pz),
          q: quatFromEuler(
            range(chimneyRandom, -0.35, 0.35),
            chimneyRandom() * TAU,
            range(chimneyRandom, -0.3, 0.3)
          ),
          s: new THREE.Vector3(
            range(chimneyRandom, 0.13, 0.22),
            range(chimneyRandom, 0.08, 0.14),
            range(chimneyRandom, 0.1, 0.16)
          ),
          c: new THREE.Color(pick(chimneyRandom, ['#cac3b3', '#b7b1a1', '#9f9b8d', '#d5ccba', '#a9a79b'])),
        });
      }
    }
  }
  cabinGroup.add(makeInstanced(new THREE.DodecahedronGeometry(1, 0), MATS.stone, chimneyStones, { castShadow: true, receiveShadow: true }));

  const chimneyMossItems = [];
  for (let i = 0; i < 8; i++) {
    chimneyMossItems.push({
      p: new THREE.Vector3(
        chimneyX + range(chimneyRandom, -0.42, 0.42),
        range(chimneyRandom, 5.4, 6.5),
        chimneyZ + range(chimneyRandom, 0.36, 0.5) * (chimneyRandom() > 0.5 ? 1 : -1)
      ),
      q: randomQuat(chimneyRandom),
      s: new THREE.Vector3(range(chimneyRandom, 0.06, 0.15), range(chimneyRandom, 0.018, 0.045), range(chimneyRandom, 0.05, 0.13)),
      c: new THREE.Color(pick(chimneyRandom, ['#7b8e5b', '#667b4f', '#8b9665'])),
    });
  }
  cabinGroup.add(makeInstanced(mossGeo, mossMat, chimneyMossItems, { receiveShadow: true }));

  /* --- moss + leaves on the roof --- */
  const roofMoss = [];
  const roofRandom = createRng(991);
  for (let i = 0; i < 22; i++) {
    const t = roofRandom();
    const side = roofRandom() > 0.3 ? 1 : -1;
    const z = side > 0 ? lerp(0.35, eaveFrontZ, t) : lerp(0.2, eaveBackZ, t);
    const y = ridgeY - Math.abs(z - ridgeZ) * Math.tan(roofAngle) + 0.12;
    roofMoss.push({
      p: new THREE.Vector3(range(roofRandom, -3.7, 3.7), y, z),
      q: randomQuat(roofRandom),
      s: new THREE.Vector3(range(roofRandom, 0.04, 0.12), range(roofRandom, 0.012, 0.04), range(roofRandom, 0.035, 0.11)),
      c: new THREE.Color(pick(roofRandom, ['#718652', '#62764b', '#87936a', '#53684b', '#8d8f60'])),
    });
  }
  cabinGroup.add(makeInstanced(mossGeo, mossMat, roofMoss, { castShadow: false, receiveShadow: true }));

  // Flat, slope-aligned lichen patches read better at a distance than blobs.
  const roofPatchMaterial = new THREE.MeshStandardMaterial({
    map: TEX.moss,
    alphaTest: 0.25,
    side: THREE.DoubleSide,
    roughness: 1,
    metalness: 0,
    color: 0xffffff,
    polygonOffset: true,
    polygonOffsetFactor: -2,
    polygonOffsetUnits: -2,
  });
  const roofPatchItems = [];
  for (let i = 0; i < 44; i++) {
    const front = roofRandom() > 0.26;
    const t = roofRandom();
    const z = front ? lerp(0.4, eaveFrontZ - 0.1, t) : lerp(0.3, eaveBackZ + 0.1, t);
    const y = ridgeY - Math.abs(z - ridgeZ) * Math.tan(roofAngle) + 0.105;
    const tilt = -Math.PI / 2 + (front ? roofAngle : -roofAngle);
    const q = new THREE.Quaternion()
      .setFromAxisAngle(AXIS_X, tilt)
      .multiply(new THREE.Quaternion().setFromAxisAngle(AXIS_Z, roofRandom() * TAU));
    roofPatchItems.push({
      p: new THREE.Vector3(range(roofRandom, -3.55, 3.55), y, z),
      q,
      s: new THREE.Vector3(range(roofRandom, 0.22, 0.72), range(roofRandom, 0.16, 0.48), 1),
      c: new THREE.Color(pick(roofRandom, ['#b6c195', '#9eae7b', '#c7cba6', '#8da077'])),
    });
  }
  const roofPatchMesh = makeInstanced(new THREE.PlaneGeometry(1, 1), roofPatchMaterial, roofPatchItems, { receiveShadow: true });
  cabinGroup.add(roofPatchMesh);

  /* --- interior window glow / point light anchors for the animation --- */
  cabinAnchors.lanternGroup = lanternGroup;
  cabinAnchors.lanternPoint = lanternPoint;
  cabinAnchors.lanternGlassMaterial = lanternGlassMat;
  cabinAnchors.lanternInner = lanternInner;
  cabinAnchors.lanternGlow = glow;
  cabinAnchors.lanternWorld = new THREE.Vector3(
    CABIN.center.x + lanternGroup.position.x,
    CABIN.center.y + lanternGroup.position.y,
    CABIN.center.z + lanternGroup.position.z
  );
  cabinAnchors.chimneyWorld = new THREE.Vector3(
    CABIN.center.x + cabinAnchors.chimney.x,
    CABIN.center.y + cabinAnchors.chimney.y,
    CABIN.center.z + cabinAnchors.chimney.z
  );

  cabinGroup.updateMatrixWorld(true);
}

   06 路 FOREST

const UP = new THREE.Vector3(0, 1, 0);
const AXIS_X = new THREE.Vector3(1, 0, 0);
const AXIS_Z = new THREE.Vector3(0, 0, 1);

const forestRandom = createRng(4311);
const forestAnchors = [];
const treeBases = [];

const pineCardsMaterial = new THREE.MeshStandardMaterial({

});
addWind(pineCardsMaterial, { amplitude: 0.055, speed: 0.85, bend: 'uv.x * 0.75 + 0.25', phase: 0.2, key: 'pine' });

const leafCardsMaterial = new THREE.MeshStandardMaterial({

const pineCoreMaterial = new THREE.MeshStandardMaterial({

});
// Far trees are simple fog-bound silhouettes. Unlit material keeps them from

const farPineMaterial = new THREE.MeshBasicMaterial({

});
const farTrunkMaterial = new THREE.MeshBasicMaterial({

const foliage = {
  trunks: [],
  pineCards: [],
  pineCores: [],
  branches: [],
  leafCards: [],
  farCones: [],
  farTrunks: [],
  farCanopies: [],
};

const trunkCylinderGeometry = (() => {
  const geo = new THREE.CylinderGeometry(0.55, 1, 1, 7, 1, false);
  geo.translate(0, 0.5, 0);
  return geo;
})();

const pineCoreGeometry = (() => {
  const geo = new THREE.ConeGeometry(1, 1, 8, 1, false);
  geo.translate(0, 0.5, 0);
  // A little irregularity makes the far silhouettes less manufactured.
  const positions = geo.attributes.position;
  for (let i = 0; i < positions.count; i++) {
    const x = positions.getX(i);
    const y = positions.getY(i);
    const z = positions.getZ(i);
    if (y > 0.02 && y < 0.99) {
      positions.setX(i, x * (1 + Math.sin(i * 2.7) * 0.08));
      positions.setZ(i, z * (1 + Math.cos(i * 1.9) * 0.08));
    }
  }
  geo.computeVertexNormals();
  return geo;
})();

const pineCardGeometry = makeRootedPlaneGeometry();
const leafCardGeometry = new THREE.PlaneGeometry(1, 1, 1, 1);

function trunkColor(random) {
  return new THREE.Color(pick(random, ['#ad9a82', '#8f7e69', '#b8a48c', '#82715e', '#a18d76']));
}

function cardColor(random, palette) {
  return new THREE.Color(pick(random, palette));
}

const PINE_TINTS = ['#d8e2ca', '#bfd0b4', '#e4ddbb', '#a9bfa7', '#c7d3b6', '#c2c09c'];
const LEAF_TINTS = ['#d5ddc0', '#c2d1b3', '#e1d8b0', '#a8bea3', '#d1c7a2', '#b3c6a8'];

function addPine(x, z, height, radius, detail = 1) {
  const random = forestRandom;
  const baseY = terrainHeight(x, z) - 0.03;
  const trunkRadius = Math.max(0.12, height * 0.018 + range(random, -0.02, 0.035));
  const yaw = random() * TAU;
  foliage.trunks.push({
    p: new THREE.Vector3(x, baseY, z),
    q: quatFromEuler(range(random, -0.025, 0.025), yaw, range(random, -0.02, 0.02), 'YXZ'),
    s: new THREE.Vector3(trunkRadius, height * 0.96, trunkRadius),
    c: trunkColor(random),
  });

  // A couple of bare stubs on the taller pines catch the low sun.
  if (detail >= 1 && height > 11) {
    const stubs = detail >= 2 ? 3 : 2;
    for (let i = 0; i < stubs; i++) {
      const t = range(random, 0.2, 0.45);
      const start = new THREE.Vector3(x, baseY + height * t, z);
      const a = random() * TAU;
      const len = range(random, 0.7, 1.7);
      const end = new THREE.Vector3(
        start.x + Math.cos(a) * len,
        start.y + range(random, 0.2, 0.7),
        start.z + Math.sin(a) * len
      );
      foliage.branches.push({
        p: start,
        q: new THREE.Quaternion().setFromUnitVectors(UP, end.clone().sub(start).normalize()),
        s: new THREE.Vector3(0.055, len, 0.055),
        c: new THREE.Color(pick(random, ['#7e6f5d', '#6c5e4f', '#8c7b66'])),
      });
    }
  }

  if (detail >= 1) {
    // A narrow inner mass gives the crown body; the cards make the silhouette.
    foliage.pineCores.push({
      p: new THREE.Vector3(x, baseY + height * 0.64, z),
      q: quatFromEuler(0, random() * TAU, 0),
      s: new THREE.Vector3(radius * 0.26, height * 0.28, radius * 0.26),
      c: new THREE.Color(pick(random, ['#566c55', '#4c604d', '#617359', '#475b48'])),
    });

    const levels = detail >= 2 ? 13 : 9;
    const perLevel = detail >= 2 ? 4 : 3;
    const bareTrunk = height > 14 ? 0.27 : 0.17;
    for (let l = 0; l < levels; l++) {
      const baseT = bareTrunk + (l / Math.max(1, levels - 1)) * (0.96 - bareTrunk);
      const t = clamp(baseT + range(random, -0.015, 0.015), bareTrunk * 0.8, 0.985);
      const angleOffset = l * 1.62 + range(random, -0.28, 0.28);
      for (let k = 0; k < perLevel; k++) {
        const angle = angleOffset + (k / perLevel) * TAU + range(random, -0.26, 0.26);
        const canopyRadius = radius * (1.04 - t * 0.76) * range(random, 0.88, 1.14);
        const cardLen = canopyRadius * range(random, 0.86, 1.18);
        const droop = range(random, 0.06, 0.27);
        const roll = range(random, -0.35, 0.35);
        const q = new THREE.Quaternion()
          .setFromAxisAngle(UP, angle)
          .multiply(new THREE.Quaternion().setFromAxisAngle(AXIS_Z, -droop))
          .multiply(new THREE.Quaternion().setFromAxisAngle(AXIS_X, roll));
        foliage.pineCards.push({
          p: new THREE.Vector3(x + range(random, -0.06, 0.06), baseY + height * t, z + range(random, -0.06, 0.06)),
          q,
          s: new THREE.Vector3(cardLen, Math.max(0.4, cardLen * range(random, 0.36, 0.52)), 1),
          c: cardColor(random, PINE_TINTS),
        });
      }
    }

    // A short upward tuft at the very top, so the pine ends in a point.
    for (let i = 0; i < 4; i++) {
      const angle = random() * TAU;
      const q = new THREE.Quaternion()
        .setFromAxisAngle(UP, angle)
        .multiply(new THREE.Quaternion().setFromAxisAngle(AXIS_Z, range(random, -0.18, 0.08)));
      const len = radius * range(random, 0.1, 0.2);
      foliage.pineCards.push({
        p: new THREE.Vector3(x, baseY + height * range(random, 0.9, 0.97), z),
        q,
        s: new THREE.Vector3(len, Math.max(0.32, len * 0.7), 1),
        c: cardColor(random, PINE_TINTS),
      });
    }
  }

  treeBases.push({ x, z, r: trunkRadius + 0.2, type: 'pine', height });
  forestAnchors.push({ x, z, baseY, height, type: 'pine' });
}

function addBroadleaf(x, z, height, radius, detail = 1) {
  const random = forestRandom;
  const baseY = terrainHeight(x, z) - 0.04;
  const trunkRadius = Math.max(0.1, height * 0.022 + range(random, -0.02, 0.03));
  const leanX = range(random, -0.48, 0.48);
  const leanZ = range(random, -0.42, 0.42);
  const top = new THREE.Vector3(x + leanX, baseY + height * 0.67, z + leanZ);
  const mid = new THREE.Vector3(x + leanX * 0.28, baseY + height * 0.32, z + leanZ * 0.26);

  foliage.branches.push({
    p: new THREE.Vector3(x, baseY, z),
    q: new THREE.Quaternion().setFromUnitVectors(UP, mid.clone().sub(new THREE.Vector3(x, baseY, z)).normalize()),
    s: new THREE.Vector3(trunkRadius, mid.y - baseY + 0.08, trunkRadius),
    c: trunkColor(random),
  });
  foliage.branches.push({
    p: mid,
    q: new THREE.Quaternion().setFromUnitVectors(UP, top.clone().sub(mid).normalize()),
    s: new THREE.Vector3(trunkRadius * 0.7, top.distanceTo(mid) + 0.06, trunkRadius * 0.7),
    c: trunkColor(random),
  });

  const branchCount = detail >= 2 ? 6 : 4;
  const canopyCenter = new THREE.Vector3(
    x + leanX * 1.1,
    baseY + height * 0.76,
    z + leanZ * 1.1
  );
  const branchTips = [];
  for (let b = 0; b < branchCount; b++) {
    const angle = (b / branchCount) * TAU + range(random, -0.7, 0.7);
    const reach = radius * range(random, 0.45, 0.85);
    const tip = new THREE.Vector3(
      canopyCenter.x + Math.cos(angle) * reach,
      canopyCenter.y + range(random, -height * 0.09, height * 0.16),
      canopyCenter.z + Math.sin(angle) * reach
    );
    branchTips.push(tip);
    const start = new THREE.Vector3(
      x + leanX * 0.6 + Math.cos(angle) * 0.12,
      baseY + height * range(random, 0.45, 0.6),
      z + leanZ * 0.6 + Math.sin(angle) * 0.12
    );
    foliage.branches.push({
      p: start,
      q: new THREE.Quaternion().setFromUnitVectors(UP, tip.clone().sub(start).normalize()),
      s: new THREE.Vector3(trunkRadius * range(random, 0.24, 0.42), start.distanceTo(tip), trunkRadius * range(random, 0.24, 0.42)),
      c: trunkColor(random),
    });
  }

  if (detail >= 1) {
    const leafCount = detail >= 2 ? 34 : 23;
    for (let i = 0; i < leafCount; i++) {
      let px;
      let py;
      let pz;
      if (i < branchTips.length * 2) {
        const tip = branchTips[i % branchTips.length];
        px = tip.x + range(random, -1.1, 1.1) * radius * 0.45;
        py = tip.y + range(random, -height * 0.12, height * 0.14);
        pz = tip.z + range(random, -1.1, 1.1) * radius * 0.45;
      } else {
        const angle = random() * TAU;
        const rr = Math.sqrt(random()) * radius;
        px = canopyCenter.x + Math.cos(angle) * rr;
        pz = canopyCenter.z + Math.sin(angle) * rr;
        py = canopyCenter.y + range(random, -height * 0.19, height * 0.22);
      }
      const size = height * range(random, 0.17, 0.29);
      foliage.leafCards.push({
        p: new THREE.Vector3(px, py, pz),
        q: randomQuat(random),
        s: new THREE.Vector3(size * range(random, 0.85, 1.25), size * range(random, 0.8, 1.05), 1),
        c: cardColor(random, LEAF_TINTS),
      });
    }
  }

  treeBases.push({ x, z, r: trunkRadius + 0.25, type: 'broadleaf', height });
  forestAnchors.push({ x, z, baseY, height, type: 'broadleaf' });
}

function addBush(x, z, size, detail = 1) {
  const random = forestRandom;
  const baseY = terrainHeight(x, z);
  const count = detail >= 2 ? 12 : 8;
  for (let i = 0; i < count; i++) {
    const a = random() * TAU;
    const rr = Math.sqrt(random()) * size;
    const px = x + Math.cos(a) * rr;
    const pz = z + Math.sin(a) * rr;
    const py = baseY + range(random, size * 0.15, size * 0.78);
    const scale = size * range(random, 0.44, 0.8);
    foliage.leafCards.push({
      p: new THREE.Vector3(px, py, pz),
      q: randomQuat(random),
      s: new THREE.Vector3(scale * 1.2, scale, 1),
      c: cardColor(random, LEAF_TINTS),
    });
  }
  treeBases.push({ x, z, r: size * 0.6, type: 'bush', height: size });
}

function addFarPine(x, z, height, radius, seedOffset = 0) {
  const random = createRng(9000 + seedOffset);
  const baseY = terrainHeight(x, z) - 0.1;
  foliage.farTrunks.push({
    p: new THREE.Vector3(x, baseY, z),
    q: quatFromEuler(0, random() * TAU, 0),
    s: new THREE.Vector3(height * 0.014, height * 0.95, height * 0.014),
    c: new THREE.Color(pick(random, ['#746f63', '#64685c', '#817c6c'])),
  });
  const tiers = 5;
  for (let i = 0; i < tiers; i++) {
    const t = 0.26 + i * 0.142;
    const tierH = height * (0.28 - i * 0.028);
    foliage.farCones.push({
      p: new THREE.Vector3(x + range(random, -0.18, 0.18), baseY + height * t, z + range(random, -0.18, 0.18)),
      q: quatFromEuler(0, random() * TAU, 0),
      s: new THREE.Vector3(radius * (0.62 - i * 0.1), tierH, radius * (0.62 - i * 0.1)),
      c: new THREE.Color(pick(random, ['#4c5d51', '#435348', '#58685a', '#39493f', '#62705f'])),
    });
  }
  // A feathery fringe breaks up the geometric cone silhouette.
  const fringeCount = 7;
  for (let i = 0; i < fringeCount; i++) {
    const t = range(random, 0.31, 0.92);
    const angle = random() * TAU;
    const len = radius * range(random, 0.7, 1.15) * (1.05 - t * 0.45);
    const q = new THREE.Quaternion()
      .setFromAxisAngle(UP, angle)
      .multiply(new THREE.Quaternion().setFromAxisAngle(AXIS_Z, -range(random, 0.04, 0.2)));
    foliage.pineCards.push({
      p: new THREE.Vector3(x, baseY + height * t, z),
      q,
      s: new THREE.Vector3(len, Math.max(0.38, len * range(random, 0.3, 0.42)), 1),
      c: cardColor(random, PINE_TINTS),
    });
  }
}

function isNearCabin(x, z, pad = 1.0) {
  const halfW = CABIN.width * 0.5 + 1.5 + pad;
  const halfD = CABIN.depth * 0.5 + 1.9 + pad;
  return Math.abs(x - CABIN.center.x) < halfW && Math.abs(z - CABIN.center.z) < halfD;
}

function isInGarden(x, z, pad = 0.7) {
  return (
    Math.abs(x - GARDEN_CENTER.x) < 2.35 + pad &&
    Math.abs(z - GARDEN_CENTER.z) < 2.15 + pad
  );
}

function isOnPath(x, z, pad = 1.5) {
  return distanceToPath(x, z) < pad;
}

function isNearOtherTree(x, z, minDistance = 1.4) {
  for (let i = 0; i < treeBases.length; i++) {
    const t = treeBases[i];
    if (Math.hypot(x - t.x, z - t.z) < Math.max(minDistance, t.r + minDistance * 0.35)) return true;
  }
  return false;
}

function buildForest() {
  // Deliberate hero trees establish the frame before the random forest fills in.
  addPine(-5.3, -2.0, 17.8, 3.85, 2);
  addPine(-7.2, -10.8, 20.0, 4.4, 2);
  addPine(-2.4, -17.8, 18.5, 4.2, 1);
  addPine(2.2, -21.5, 21.0, 4.8, 1);
  addPine(9.2, -16.0, 19.5, 4.5, 1);
  addPine(15.4, -9.0, 17.5, 3.8, 1);
  addPine(11.8, -22.0, 22.5, 5.0, 1);
  addPine(-10.4, -19.0, 22.0, 4.6, 1);
  addPine(-13.0, -8.0, 18.0, 4.0, 1);
  addPine(-8.8, 4.8, 16.4, 3.7, 2);

  addBroadleaf(10.8, -5.0, 8.7, 3.4, 2);
  addBroadleaf(-9.4, -3.8, 9.1, 3.6, 2);
  addBroadleaf(6.8, -13.2, 7.6, 2.9, 1);
  addBroadleaf(16.5, -14.5, 9.4, 3.3, 1);

  // Understory trees and thickets break up the tall colonnade of trunks.
  addBroadleaf(-7.6, -5.2, 5.3, 2.3, 1);
  addBroadleaf(11.7, -9.0, 5.7, 2.4, 1);
  addBroadleaf(-3.9, -13.0, 4.8, 2.1, 1);
  addBroadleaf(16.2, -2.5, 5.2, 2.2, 1);
  addBush(9.3, -7.5, 1.5, 2);
  addBush(-8.3, -8.3, 1.5, 2);
  addBush(4.8, -11.6, 1.25, 1);
  addBush(-11.2, -6.2, 1.6, 1);
  addBush(13.0, -6.5, 1.2, 1);
  addBush(-5.2, -10.7, 1.3, 1);

  // Understory / framing bushes.
  addBush(-4.45, 1.55, 1.2, 2);
  addBush(-5.05, 4.2, 1.05, 1);
  addBush(1.25, 4.3, 0.95, 2);
  addBush(6.35, -1.7, 1.3, 2);
  addBush(-1.2, -1.9, 0.75, 1);
  addBush(8.0, 1.6, 1.25, 1);
  addBush(0.3, -10.0, 1.1, 1);
  addBush(8.9, -9.4, 1.35, 1);
  addBush(-8.2, 3.2, 1.0, 1);

  const cameraStart = new THREE.Vector3(-2.0, 0, 11.0);
  const tries = 460;
  let placed = 0;
  for (let attempt = 0; attempt < tries && placed < 108; attempt++) {
    const angle = forestRandom() * TAU;
    const radius = Math.sqrt(forestRandom()) * 44 + 8.5;
    const x = CLEARING.x + Math.cos(angle) * radius;
    const z = CLEARING.z + Math.sin(angle) * radius * 0.92;
    const roll = forestRandom();

    if (Math.hypot(x - cameraStart.x, z - cameraStart.z) < 4.0) continue;
    if (isNearCabin(x, z, 0.5)) continue;
    if (isInGarden(x, z, 0.6)) continue;
    if (isOnPath(x, z, 2.35)) continue;
    if (isNearOtherTree(x, z, 1.7)) continue;

    const isBroadleaf = roll > 0.76;
    const isBush = !isBroadleaf && roll > 0.635;
    if (isBush) {
      if (Math.hypot(x - CLEARING.x, z - CLEARING.z) < 13) continue;
      const size = range(forestRandom, 0.55, 1.35);
      addBush(x, z, size, size > 0.9 ? 2 : 1);
    } else if (isBroadleaf) {
      const height = range(forestRandom, 6.0, 10.5) * (radius > 28 ? 1.05 : 1);
      addBroadleaf(x, z, height, height * range(forestRandom, 0.28, 0.38), radius < 28 ? 1 : 1);
    } else {
      const height = range(forestRandom, 9.5, 20.5);
      const detail = radius < 22 && forestRandom() > 0.35 ? 2 : 1;
      addPine(x, z, height, height * range(forestRandom, 0.17, 0.24), detail);
    }
    placed++;
  }

  // Distant forest wall: low-poly silhouettes softened by fog.
  for (let i = 0; i < 170; i++) {
    const angle = (i / 170) * TAU + range(forestRandom, -0.035, 0.035);
    const radius = range(forestRandom, 34, 86);
    const x = CLEARING.x + Math.cos(angle) * radius;
    const z = CLEARING.z + Math.sin(angle) * radius;
    if (z > 28 && Math.abs(x - 1) < 16) continue;
    const height = range(forestRandom, 10.0, 24.5) * (radius > 58 ? 1.08 : 1);
    addFarPine(x, z, height, height * range(forestRandom, 0.13, 0.19), i * 3 + 1);
  }
  // A few closer background pines make the forest feel continuous rather than ringed.
  for (let i = 0; i < 34; i++) {
    const angle = range(forestRandom, Math.PI * 0.38, Math.PI * 1.72);
    const radius = range(forestRandom, 24, 42);
    const x = CLEARING.x + Math.cos(angle) * radius;
    const z = CLEARING.z + Math.sin(angle) * radius;
    if (isOnPath(x, z, 2.8) || isNearCabin(x, z, 2)) continue;
    addFarPine(x, z, range(forestRandom, 10.5, 19.5), range(forestRandom, 2.2, 3.3), 300 + i);
  }

  // Understory fills the gaps between trunks and hides the fog line at their feet.
  for (let i = 0; i < 20; i++) {
    const angle = forestRandom() * TAU;
    const radius = range(forestRandom, 13, 33);
    const x = CLEARING.x + Math.cos(angle) * radius;
    const z = CLEARING.z + Math.sin(angle) * radius;
    if (isOnPath(x, z, 3.0) || isNearCabin(x, z, 1.2) || isInGarden(x, z, 1.0)) continue;
    if (z > -3.5 && x > -5.0 && x < 10.0) continue;
    if (isNearOtherTree(x, z, 1.6)) continue;
    const height = range(forestRandom, 3.4, 6.4);
    addBroadleaf(x, z, height, height * range(forestRandom, 0.28, 0.4), 1);
  }
  for (let i = 0; i < 44; i++) {
    const angle = forestRandom() * TAU;
    const radius = range(forestRandom, 11, 37);
    const x = CLEARING.x + Math.cos(angle) * radius;
    const z = CLEARING.z + Math.sin(angle) * radius;
    if (isOnPath(x, z, 2.1) || isNearCabin(x, z, 0.8) || isInGarden(x, z, 0.8)) continue;
    if (z > -2 && x > -4.5 && x < 9) continue;
    if (isNearOtherTree(x, z, 1.1)) continue;
    addBush(x, z, range(forestRandom, 0.65, 1.55), forestRandom() > 0.7 ? 2 : 1);
  }

  // Rounded, distant broadleaf crowns soften the horizon between the pines.
  for (let i = 0; i < 26; i++) {
    const angle = (i / 26) * TAU + range(forestRandom, -0.11, 0.11);
    const radius = range(forestRandom, 25, 56);
    const x = CLEARING.x + Math.cos(angle) * radius;
    const z = CLEARING.z + Math.sin(angle) * radius * 0.94;
    if (z > 17 && Math.abs(x) < 18) continue;
    const height = range(forestRandom, 7.5, 14.0);
    foliage.farTrunks.push({
      p: new THREE.Vector3(x, terrainHeight(x, z) - 0.1, z),
      q: quatFromEuler(0, forestRandom() * TAU, 0),
      s: new THREE.Vector3(height * 0.022, height * 0.75, height * 0.022),
      c: new THREE.Color(pick(forestRandom, ['#776f60', '#686356', '#847b68'])),
    });
    const crownY = terrainHeight(x, z) + height * 0.7;
    const crownR = height * range(forestRandom, 0.25, 0.38);
    for (let b = 0; b < 4; b++) {
      const a = (b / 4) * TAU + forestRandom() * 0.9;
      const rr = crownR * range(forestRandom, 0.2, 0.75);
      foliage.farCanopies.push({
        p: new THREE.Vector3(
          x + Math.cos(a) * rr,
          crownY + range(forestRandom, -height * 0.12, height * 0.18),
          z + Math.sin(a) * rr
        ),
        q: quatFromEuler(0, forestRandom() * TAU, 0),
        s: new THREE.Vector3(
          crownR * range(forestRandom, 0.52, 0.8),
          crownR * range(forestRandom, 0.4, 0.65),
          crownR * range(forestRandom, 0.52, 0.8)
        ),
        c: new THREE.Color(pick(forestRandom, ['#53654f', '#5e6c50', '#4a5d4b', '#687253', '#756f51'])),
      });
    }
  }

  const trunkMesh = makeInstanced(trunkCylinderGeometry, MATS.bark, foliage.trunks, {
    castShadow: true,
    receiveShadow: true,
  });
  scene.add(trunkMesh);

  const pineCardMesh = makeInstanced(pineCardGeometry, pineCardsMaterial, foliage.pineCards, {
    castShadow: true,
    receiveShadow: true,
  });
  scene.add(pineCardMesh);

  const pineCoreMesh = makeInstanced(pineCoreGeometry, pineCoreMaterial, foliage.pineCores, {
    castShadow: true,
    receiveShadow: true,
  });
  scene.add(pineCoreMesh);

  const branchMesh = makeInstanced(trunkCylinderGeometry, MATS.bark, foliage.branches, {
    castShadow: true,
    receiveShadow: true,
  });
  scene.add(branchMesh);

  const leafCardMesh = makeInstanced(leafCardGeometry, leafCardsMaterial, foliage.leafCards, {
    castShadow: true,
    receiveShadow: true,
  });
  scene.add(leafCardMesh);

  const farConeMesh = makeInstanced(pineCoreGeometry, farPineMaterial, foliage.farCones, {
    castShadow: false,
    receiveShadow: false,
  });
  scene.add(farConeMesh);

  const farTrunkMesh = makeInstanced(trunkCylinderGeometry, farTrunkMaterial, foliage.farTrunks, {
    castShadow: false,
    receiveShadow: false,
  });
  scene.add(farTrunkMesh);

  if (foliage.farCanopies.length) {
    const farCanopyGeo = new THREE.IcosahedronGeometry(1, 1);
    const farCanopyMesh = makeInstanced(farCanopyGeo, farCanopyMaterial, foliage.farCanopies, {
      castShadow: false,
      receiveShadow: false,
    });
    scene.add(farCanopyMesh);
  }
}

/* ==========================================================================
   07 路 GROUND DETAIL, GARDEN + PROPS
   ========================================================================== */

const detailRandom = createRng(8817);
const grassItems = [];
const fernItems = [];
const rockItems = [];
const mossClumpItems = [];
const mossDecalItems = [];
const litterItems = [];
const mushroomStemItems = [];
const mushroomCapItems = [];
const flowerItems = [];

/* ---- grass -------------------------------------------------------------- */

const grassMaterial = new THREE.MeshStandardMaterial({
  map: TEX.grass,
  alphaTest: 0.26,
  side: THREE.DoubleSide,
  roughness: 1,
  metalness: 0,
  color: 0xffffff,
});
addWind(grassMaterial, { amplitude: 0.062, speed: 1.22, bend: 'smoothstep(0.0, 0.85, position.y)', phase: 2.1, key: 'grass' });

const grassGeometry = makeCrossedBladeGeometry(3);
const GRASS_TINTS = ['#c4d0ad', '#a9bd92', '#d3c59a', '#b4b58c', '#8fa77f', '#c8b88f'];

function addGrass(x, z) {
  const y = terrainHeight(x, z);
  const h = range(detailRandom, 0.14, 0.46) * (detailRandom() > 0.9 ? 1.55 : 1);
  const w = h * range(detailRandom, 0.8, 1.4);
  grassItems.push({
    p: new THREE.Vector3(x, y + 0.01, z),
    q: quatFromEuler(0, detailRandom() * TAU, 0),
    s: new THREE.Vector3(w, h, w),
    c: new THREE.Color(pick(detailRandom, GRASS_TINTS)),
  });
}

function grassIsAllowed(x, z) {
  if (Math.abs(x - CABIN.center.x) < CABIN.width * 0.5 + 0.35 &&
      Math.abs(z - CABIN.center.z) < CABIN.depth * 0.5 + 2.3) return false;
  if (distanceToPath(x, z) < 0.86) return false;
  if (Math.hypot(x - GARDEN_CENTER.x, z - GARDEN_CENTER.z) < 2.45) return false;
  return true;
}

function placeGrass() {
  // Dense, patchy meadow around the clearing.
  let attempts = 0;
  while (grassItems.length < 1180 && attempts < 9000) {
    attempts++;
    const angle = detailRandom() * TAU;
    const r = Math.sqrt(detailRandom()) * 33;
    const x = CLEARING.x + Math.cos(angle) * r;
    const z = CLEARING.z + Math.sin(angle) * r * 0.9;
    if (!grassIsAllowed(x, z)) continue;
    addGrass(x, z);
  }
  // A dedicated fringe following the path, for foreground scale.
  attempts = 0;
  while (grassItems.length < 1720 && attempts < 9000) {
    attempts++;
    const t = detailRandom();
    const p = pathCurve.getPointAt(t);
    const tangent = pathCurve.getTangentAt(t);
    const side = detailRandom() > 0.5 ? 1 : -1;
    const offset = side * range(detailRandom, 1.0, 2.8);
    const x = p.x - tangent.z * offset + range(detailRandom, -0.2, 0.2);
    const z = p.z + tangent.x * offset + range(detailRandom, -0.2, 0.2);
    if (!grassIsAllowed(x, z)) continue;
    addGrass(x, z);
  }
}

/* ---- ferns -------------------------------------------------------------- */

const fernMaterial = new THREE.MeshStandardMaterial({
  map: TEX.fern,
  alphaTest: 0.28,
  side: THREE.DoubleSide,
  roughness: 0.96,
  metalness: 0,
  color: 0xffffff,
});
addWind(fernMaterial, { amplitude: 0.045, speed: 0.9, bend: 'smoothstep(0.0, 0.9, position.y)', phase: 3.2, key: 'fern' });

const fernGeometry = makeBasePlaneGeometry();
const FERN_TINTS = ['#a9bd93', '#93a982', '#c3bd8c', '#a7b686', '#879a77', '#b6af83'];

function addFernCluster(x, z, size = 1, richness = 1) {
  const y = terrainHeight(x, z);
  const count = Math.round((6 + richness * 4) * (0.85 + size * 0.2));
  const phase = detailRandom() * TAU;
  for (let i = 0; i < count; i++) {
    const angle = phase + (i / count) * TAU + range(detailRandom, -0.24, 0.24);
    const tilt = range(detailRandom, 0.48, 1.02) * (i % 3 === 0 ? 0.8 : 1);
    const height = range(detailRandom, 0.54, 1.02) * size;
    const width = height * range(detailRandom, 0.8, 1.25);
    const q = new THREE.Quaternion()
      .setFromAxisAngle(UP, angle)
      .multiply(new THREE.Quaternion().setFromAxisAngle(AXIS_X, tilt));
    fernItems.push({
      p: new THREE.Vector3(x + range(detailRandom, -0.07, 0.07) * size, y + 0.015, z + range(detailRandom, -0.07, 0.07) * size),
      q,
      s: new THREE.Vector3(width, height, 1),
      c: cardColor(detailRandom, FERN_TINTS),
    });
  }
}

function fernIsAllowed(x, z) {
  if (Math.hypot(x - CABIN.center.x, z - CABIN.center.z) < 5.9) return false;
  if (distanceToPath(x, z) < 0.75) return false;
  return true;
}

function placeFerns() {
  // Hero clusters that frame the foreground and soften the cabin base.
  const heroClusters = [
    [-3.35, 7.15, 1.3], [-4.55, 6.1, 1.05], [-2.6, 8.4, 0.95],
    [-3.7, 5.15, 1.65], [0.75, 6.8, 1.15], [1.9, 5.55, 0.9], [2.8, 7.9, 1.1],
    [-4.75, 4.55, 0.8], [2.45, 2.45, 0.72], [6.2, 0.4, 0.95],
    [7.4, -1.8, 0.8], [0.3, -1.3, 0.6], [-1.0, -5.4, 0.75],
    [-4.2, -4.6, 0.9], [9.6, 0.9, 0.95], [5.1, -8.6, 0.8],
  ];
  for (const [x, z, size] of heroClusters) addFernCluster(x, z, size, 2);

  let attempts = 0;
  while (fernItems.length < 740 && attempts < 2600) {
    attempts++;
    const angle = detailRandom() * TAU;
    const radius = range(detailRandom, 3.8, 24);
    const x = CLEARING.x + Math.cos(angle) * radius;
    const z = CLEARING.z + Math.sin(angle) * radius * 0.9;
    if (!fernIsAllowed(x, z)) continue;
    if (detailRandom() < 0.38) continue;
    addFernCluster(x, z, range(detailRandom, 0.5, 1.2), detailRandom() > 0.75 ? 2 : 1);
  }
}

/* ---- rocks -------------------------------------------------------------- */

const rockGeometry = (() => {
  const geo = new THREE.IcosahedronGeometry(1, 1);
  const pos = geo.attributes.position;
  const rnd = createRng(467);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const y = pos.getY(i);
    const z = pos.getZ(i);
    const n = 0.82 + hash2(Math.round(x * 30), Math.round(z * 30) + Math.round(y * 17), 9) * 0.28;
    pos.setXYZ(i, x * n * 1.05, y * n * 0.78, z * n);
  }
  geo.computeVertexNormals();
  return geo;
})();

const rockMaterial = new THREE.MeshStandardMaterial({
  map: TEX.stone,
  color: 0xb1ac9e,
  roughness: 0.98,
  metalness: 0,
  bumpMap: TEX.stone,
  bumpScale: 0.07,
  flatShading: true,
});

function addRock(x, z, scale, tint = '#cbc5b5', yOffset = 0, rotation = null) {
  const y = terrainHeight(x, z);
  rockItems.push({
    p: new THREE.Vector3(x, y + yOffset, z),
    q: rotation || randomQuat(detailRandom),
    s: new THREE.Vector3(scale * range(detailRandom, 0.8, 1.2), scale * range(detailRandom, 0.45, 0.78), scale * range(detailRandom, 0.8, 1.15)),
    c: new THREE.Color(tint),
  });
}

function placeRocks() {
  const hero = [
    [-4.2, 6.15, 0.72, '#b7b4a7'], [1.55, 6.2, 0.58, '#c6c0b1'],
    [-4.9, 3.7, 0.48, '#a9a99d'], [2.15, 3.65, 0.34, '#bab7aa'],
    [7.0, 1.7, 0.65, '#adaca2'], [7.8, -2.5, 0.45, '#b8b4a6'],
    [-2.2, -4.9, 0.54, '#b2b0a3'], [-6.4, -1.6, 0.82, '#a7a89b'],
    [4.0, -10.7, 0.95, '#a1a497'], [10.9, -8.2, 0.78, '#b9b4a5'],
  ];
  for (const [x, z, s, tint] of hero) addRock(x, z, s, tint, 0.02);

  for (let i = 0; i < 46; i++) {
    const angle = detailRandom() * TAU;
    const radius = range(detailRandom, 6, 32);
    const x = CLEARING.x + Math.cos(angle) * radius;
    const z = CLEARING.z + Math.sin(angle) * radius;
    if (Math.hypot(x - CABIN.center.x, z - CABIN.center.z) < 5.4) continue;
    if (distanceToPath(x, z) < 1.0) continue;
    if (detailRandom() > 0.7) continue;
    addRock(x, z, range(detailRandom, 0.1, 0.42), pick(detailRandom, ['#c1bdaf', '#a8a89c', '#b8b2a3', '#969b8d']), range(detailRandom, -0.04, 0.02));
  }

  // Pebbles along the path, tucked toward the edges.
  for (let i = 0; i < 58; i++) {
    const t = range(detailRandom, 0.02, 0.98);
    const p = pathCurve.getPointAt(t);
    const tangent = pathCurve.getTangentAt(t);
    const side = detailRandom() > 0.5 ? 1 : -1;
    const off = side * range(detailRandom, 0.46, 0.82);
    const x = p.x - tangent.z * off;
    const z = p.z + tangent.x * off;
    const y = terrainHeight(x, z) + 0.036;
    rockItems.push({
      p: new THREE.Vector3(x, y, z),
      q: randomQuat(detailRandom),
      s: new THREE.Vector3(range(detailRandom, 0.022, 0.062), range(detailRandom, 0.012, 0.033), range(detailRandom, 0.022, 0.062)),
      c: new THREE.Color(pick(detailRandom, ['#b6b1a4', '#8e9387', '#cbc3b3', '#7e8378'])),
    });
  }

  // Larger, flatter stones give the trail a clear, cared-for edge.
  for (let i = 0; i < 21; i++) {
    const t = 0.08 + (i / 21) * 0.86;
    const p = pathCurve.getPointAt(t);
    const tangent = pathCurve.getTangentAt(t);
    const side = i % 2 === 0 ? 1 : -1;
    const off = side * range(detailRandom, 0.84, 1.02);
    const x = p.x - tangent.z * off;
    const z = p.z + tangent.x * off;
    const y = terrainHeight(x, z) + 0.04;
    rockItems.push({
      p: new THREE.Vector3(x, y, z),
      q: quatFromEuler(0, detailRandom() * TAU, 0),
      s: new THREE.Vector3(range(detailRandom, 0.13, 0.26), range(detailRandom, 0.045, 0.09), range(detailRandom, 0.1, 0.18)),
      c: new THREE.Color(pick(detailRandom, ['#a8a293', '#8f9185', '#b7ae9d', '#7c8177'])),
    });
  }

  // Mossy caps on a few large stones.
  const mossy = [
    [-4.2, 6.15, 0.45, 0.72], [-6.4, -1.6, 0.52, 0.82], [7.0, 1.7, 0.4, 0.65],
    [10.9, -8.2, 0.5, 0.78], [4.0, -10.7, 0.6, 0.95],
  ];
  for (const [x, z, top, s] of mossy) {
    for (let i = 0; i < 4; i++) {
      mossClumpItems.push({
        p: new THREE.Vector3(x + range(detailRandom, -0.3, 0.3) * s, terrainHeight(x, z) + top + range(detailRandom, -0.08, 0.02), z + range(detailRandom, -0.25, 0.25) * s),
        q: randomQuat(detailRandom),
        s: new THREE.Vector3(range(detailRandom, 0.1, 0.24) * s, range(detailRandom, 0.035, 0.08) * s, range(detailRandom, 0.1, 0.25) * s),
        c: new THREE.Color(pick(detailRandom, ['#6f8551', '#5c7248', '#84915e'])),
      });
    }
  }
}

/* ---- leaf litter & moss decals ----------------------------------------- */

const litterMaterial = new THREE.MeshStandardMaterial({
  map: TEX.leaf,
  alphaTest: 0.36,
  side: THREE.DoubleSide,
  roughness: 0.96,
  metalness: 0,
  color: 0xffffff,
});

const litterGeometry = new THREE.PlaneGeometry(1, 1);
const LITTER_TINTS = ['#d3a66c', '#b98052', '#c39158', '#9d6c46', '#dcc28d', '#a75f42', '#8b6a48', '#c8a26a'];

function addLeafLitter(x, z, size = 1, yOverride = null) {
  litterItems.push({
    p: new THREE.Vector3(x, yOverride === null ? terrainHeight(x, z) + 0.052 : yOverride, z),
    q: quatFromEuler(-Math.PI / 2 + range(detailRandom, -0.12, 0.12), detailRandom() * TAU, range(detailRandom, -0.16, 0.16), 'YXZ'),
    s: new THREE.Vector3(range(detailRandom, 0.09, 0.2) * size, range(detailRandom, 0.06, 0.13) * size, 1),
    c: new THREE.Color(pick(detailRandom, LITTER_TINTS)),
  });
}

function placeLitter() {
  // Under the broadleaf canopy on the right.
  const broadleafPoint = { x: 10.8, z: -5.0 };
  for (let i = 0; i < 240; i++) {
    const a = detailRandom() * TAU;
    const r = Math.sqrt(detailRandom()) * 6.2;
    addLeafLitter(broadleafPoint.x + Math.cos(a) * r, broadleafPoint.z + Math.sin(a) * r, range(detailRandom, 0.8, 1.6));
  }
  // Clearing litter catches the foreground light.
  for (let i = 0; i < 500; i++) {
    const x = range(detailRandom, -12, 13);
    const z = range(detailRandom, -9, 10);
    if (Math.abs(x - CABIN.center.x) < 3.9 && Math.abs(z - CABIN.center.z) < 3.2) continue;
    if (isInGarden(x, z, 0.4)) continue;
    addLeafLitter(x, z, range(detailRandom, 0.7, 1.5));
  }
  // Litter on the path is a nice scale cue.
  for (let i = 0; i < 100; i++) {
    const t = detailRandom();
    const p = pathCurve.getPointAt(t);
    const tangent = pathCurve.getTangentAt(t);
    const off = range(detailRandom, -0.62, 0.62);
    addLeafLitter(p.x - tangent.z * off, p.z + tangent.x * off, range(detailRandom, 0.65, 1.15));
  }
  // A scattering on the porch roof.
  const ridgeY = 5.55;
  const ridgeZ = 0.18;
  const roofAngle = Math.atan2(1.98, 3.24);
  for (let i = 0; i < 26; i++) {
    const x = range(detailRandom, -3.5, 3.5);
    const z = range(detailRandom, 0.65, 3.15);
    const localY = ridgeY - (z - ridgeZ) * Math.tan(roofAngle) + 0.13;

function fenceRun(x1, z1, x2, z2, gateStart = null, gateEnd = null) {
  const dx = x2 - x1;
  const dz = z2 - z1;
  const length = Math.hypot(dx, dz);
  const dirX = dx / length;
  const dirZ = dz / length;
  const yaw = Math.atan2(dirX, dirZ);
  const baseY = terrainHeight((x1 + x2) / 2, (z1 + z2) / 2);
  const posts = Math.max(2, Math.round(length / 1.25));
  for (let i = 0; i <= posts; i++) {
    const t = i / posts;
    const px = lerp(x1, x2, t);
    const pz = lerp(z1, z2, t);
    const inGate = gateStart !== null && Math.abs((t * length) - gateStart) < 0.15;
    if (inGate) continue;
    fenceItems.posts.push({
      p: new THREE.Vector3(px, baseY + 0.34, pz),
      q: quatFromEuler(0, yaw, 0),
      s: new THREE.Vector3(0.08, 0.7, 0.08),
      c: new THREE.Color(pick(detailRandom, ['#c7b18f', '#b7a17f', '#d4c0a1'])),
    });
  }
  const step = 0.235;
  const count = Math.floor(length / step);
  for (let i = 0; i <= count; i++) {
    const along = i * step;
    if (gateStart !== null && along > gateStart && along < gateEnd) continue;
    const t = along / length;
    const px = x1 + dirX * along;
    const pz = z1 + dirZ * along;
    fenceItems.pickets.push({
      p: new THREE.Vector3(px, baseY + 0.27, pz),
      q: quatFromEuler(0, yaw, 0),
      s: new THREE.Vector3(0.05, 0.52, 0.028),
      c: new THREE.Color(pick(detailRandom, ['#c2ac8b', '#ac997b', '#d2bea0', '#bda587'])),
    });
  }
  const railSegments = gateStart !== null
    ? [[0.06, gateStart - 0.06], [gateEnd + 0.06, length - 0.06]]
    : [[0.06, length - 0.06]];
  for (const h of [0.27, 0.6]) {
    for (const [start, end] of railSegments) {
      if (end - start < 0.15) continue;
      const mid = (start + end) * 0.5;
      fenceItems.rails.push({
        p: new THREE.Vector3(x1 + dirX * mid, baseY + h, z1 + dirZ * mid),
        q: quatFromEuler(0, yaw, 0),
        s: new THREE.Vector3(0.045, 0.06, end - start),
        c: new THREE.Color(pick(detailRandom, ['#b9a482', '#c9b592', '#a89272'])),
      });
    }
  }
}
